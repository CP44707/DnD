<!DOCTYPE html>
<html>
<head>
  <title>Host</title>

  <style>
    html, body {
      margin: 0;
      width: 100%;
      height: 100%;
    }

    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }

    #controls {
      position: fixed;
      top: 10px;
      left: 10px;
      z-index: 10;
      background: white;
      padding: 10px;
    }
  </style>
</head>

<body>

  <div id="controls">
    <input id="host" placeholder="Enter text">
  </div>

  <iframe src="https://app.roll20.net"></iframe>

  <script>
    const input = document.getElementById("host");

    input.addEventListener("input", () => {
      localStorage.setItem("hostText", input.value);
    });
  </script>

</body>
</html>
