<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    input {
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      font-family: inherit;
    }

    #status {
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    #loginPanel {
      max-width: 400px;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
    }

    #loginPanel input {
      width: 100%;
      margin-bottom: 10px;
    }

    #loginButton,
    #logoutButton,
    #newCodeButton,
    #copyCodeButton {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 10px;
    }

    #hostPanel {
      display: none;
    }

    #sessionPanel {
      background: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    #sessionCode {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #7cff7c;
    }

    #columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .column {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .sound-button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .music-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .music-name {
      padding: 12px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-button {
      padding: 12px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .repeat-active {
      background: #4caf50;
      color: white;
    }

    @media (max-width: 700px) {
      #columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>🎲 Host Soundboard</h1>

  <p id="status">Please log in.</p>


  <!-- LOGIN -->

  <div id="loginPanel">

    <h2>Host Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- HOST -->

  <div id="hostPanel">

    <div id="sessionPanel">

      <h2>🎲 Session</h2>

      <p>
        Give this code to your players:
      </p>

      <div id="sessionCode">
        --------
      </div>

      <br>

      <button id="copyCodeButton">
        📋 Copy Code
      </button>

      <button id="newCodeButton">
        🔄 New Code
      </button>

      <button id="logoutButton">
        Logout
      </button>

    </div>


    <div id="columns">

      <!-- SOUNDS -->

      <div class="column">

        <h2>🔊 Sounds</h2>

        <div id="sounds"></div>

      </div>


      <!-- MUSIC -->

      <div class="column">

        <h2>🎵 Music</h2>

        <div id="music"></div>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const keys =
      await fetch("keys.json")
        .then(r => r.json());


    const supabase =
      createClient(
        keys.supabaseUrl,
        keys.supabaseKey
      );


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const status =
      document.getElementById("status");

    const loginPanel =
      document.getElementById("loginPanel");

    const hostPanel =
      document.getElementById("hostPanel");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const newCodeButton =
      document.getElementById("newCodeButton");

    const copyCodeButton =
      document.getElementById("copyCodeButton");

    const sessionCode =
      document.getElementById("sessionCode");

    const soundsContainer =
      document.getElementById("sounds");

    const musicContainer =
      document.getElementById("music");


    // --------------------------------------------------
    // STATE
    // --------------------------------------------------

    let channel = null;

    let connected = false;

    let sessionCodeValue = null;


    // --------------------------------------------------
    // NAME FORMAT
    // --------------------------------------------------

    function displayName(file) {

      return file
        .replace(
          /\.(mp3|wav|ogg|m4a)$/i,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        )
        .replace(
          /\b\w/g,
          letter => letter.toUpperCase()
        );

    }


    // --------------------------------------------------
    // GENERATE SESSION CODE
    // --------------------------------------------------

    function generateCode() {

      const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      let code = "";

      for (let i = 0; i < 8; i++) {

        code +=
          characters[
            Math.floor(
              Math.random() *
              characters.length
            )
          ];

      }

      return code;

    }


    // --------------------------------------------------
    // LOGIN
    // --------------------------------------------------

    loginButton.onclick =
      async () => {

        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          document
            .getElementById("loginMessage")
            .textContent =
            "Enter your email and password.";

          return;

        }


        loginButton.disabled = true;

        document
          .getElementById("loginMessage")
          .textContent =
          "Logging in...";


        const {
          data,
          error
        } =
          await supabase.auth
            .signInWithPassword({
              email,
              password
            });


        loginButton.disabled = false;


        if (error) {

          document
            .getElementById("loginMessage")
            .textContent =
            "Login failed: " +
            error.message;

          return;

        }


        document
          .getElementById("loginMessage")
          .textContent = "";


        showHost();

      };


    // --------------------------------------------------
    // SHOW HOST
    // --------------------------------------------------

    async function showHost() {

      loginPanel.style.display =
        "none";

      hostPanel.style.display =
        "block";


      status.textContent =
        "🟡 Creating session...";


      await loadSounds();

      await loadMusic();

      await createSession();

    }


    // --------------------------------------------------
    // CREATE SESSION
    // --------------------------------------------------

    async function createSession() {

      if (channel) {

        await supabase.removeChannel(
          channel
        );

        channel = null;

      }


      connected = false;


      sessionCodeValue =
        generateCode();


      sessionCode.textContent =
        sessionCodeValue;


      /*
        IMPORTANT:

        We are intentionally NOT storing
        the session in a Supabase table.

        The random code simply determines
        the Realtime channel.
      */

      channel =
        supabase.channel(
          "soundboard-" +
          sessionCodeValue
        );


      channel.subscribe(
        (state, error) => {

          console.log(
            "Host:",
            state,
            error
          );


          if (
            state === "SUBSCRIBED"
          ) {

            connected = true;


            status.textContent =
              "🟢 Connected\n" +
              "Session code: " +
              sessionCodeValue;

          }


          if (
            state === "CHANNEL_ERROR"
          ) {

            connected = false;

            status.textContent =
              "🔴 Connection error.";

            console.error(error);

          }


          if (
            state === "TIMED_OUT"
          ) {

            connected = false;

            status.textContent =
              "🔴 Connection timed out.";

          }

        }
      );

    }


    // --------------------------------------------------
    // COPY CODE
    // --------------------------------------------------

    copyCodeButton.onclick =
      async () => {

        if (!sessionCodeValue)
          return;


        await navigator
          .clipboard
          .writeText(
            sessionCodeValue
          );


        copyCodeButton.textContent =
          "✅ Copied!";


        setTimeout(() => {

          copyCodeButton.textContent =
            "📋 Copy Code";

        }, 1500);

      };


    // --------------------------------------------------
    // NEW CODE
    // --------------------------------------------------

    newCodeButton.onclick =
      async () => {

        newCodeButton.disabled =
          true;


        await createSession();


        newCodeButton.disabled =
          false;

      };


    // --------------------------------------------------
    // PLAY SOUND
    // --------------------------------------------------

    async function playSound(file) {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      await channel.send({

        type: "broadcast",

        event: "play-sound",

        payload: {

          source: "github",

          file: file

        }

      });

    }


    // --------------------------------------------------
    // PLAY MUSIC
    // --------------------------------------------------

    async function playMusic(file) {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      await channel.send({

        type: "broadcast",

        event: "play-music",

        payload: {

          source: "github",

          file: file

        }

      });

    }


    // --------------------------------------------------
    // PAUSE MUSIC
    // --------------------------------------------------

    async function pauseMusic() {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      await channel.send({

        type: "broadcast",

        event: "pause-music",

        payload: {}

      });

    }


    // --------------------------------------------------
    // REPEAT MUSIC
    // --------------------------------------------------

    async function toggleRepeat(
      file,
      repeat
    ) {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      await channel.send({

        type: "broadcast",

        event: "repeat-music",

        payload: {

          source: "github",

          file: file,

          repeat: repeat

        }

      });

    }


    // --------------------------------------------------
    // LOAD SOUNDS
    // --------------------------------------------------

    async function loadSounds() {

      soundsContainer.innerHTML =
        "";


      const files =
        await fetch("sounds.json")
          .then(r => r.json());


      files.forEach(file => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "sound-button";


        button.textContent =
          displayName(file);


        button.disabled =
          true;


        button.onclick =
          () => {

            playSound(file);

          };


        soundsContainer.appendChild(
          button
        );

      });

    }


    // --------------------------------------------------
    // LOAD MUSIC
    // --------------------------------------------------

    async function loadMusic() {

      musicContainer.innerHTML =
        "";


      const files =
        await fetch("music.json")
          .then(r => r.json());


      files.forEach(file => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "music-item";


        const name =
          document.createElement(
            "div"
          );


        name.className =
          "music-name";


        name.textContent =
          displayName(file);


        // PLAY

        const playButton =
          document.createElement(
            "button"
          );


        playButton.className =
          "music-button";


        playButton.textContent =
          "▶";


        playButton.disabled =
          true;


        playButton.onclick =
          () => {

            playMusic(file);

          };


        // PAUSE

        const pauseButton =
          document.createElement(
            "button"
          );


        pauseButton.className =
          "music-button";


        pauseButton.textContent =
          "⏸";


        pauseButton.disabled =
          true;


        pauseButton.onclick =
          () => {

            pauseMusic();

          };


        // REPEAT

        const repeatButton =
          document.createElement(
            "button"
          );


        repeatButton.className =
          "music-button";


        repeatButton.textContent =
          "🔁";


        repeatButton.disabled =
          true;


        let repeating = false;


        repeatButton.onclick =
          () => {

            repeating =
              !repeating;


            repeatButton.classList.toggle(
              "repeat-active",
              repeating
            );


            toggleRepeat(
              file,
              repeating
            );

          };


        item.appendChild(name);

        item.appendChild(playButton);

        item.appendChild(pauseButton);

        item.appendChild(repeatButton);


        musicContainer.appendChild(
          item
        );

      });

    }


    // --------------------------------------------------
    // ENABLE CONTROLS
    // --------------------------------------------------

    function enableControls() {

      document
        .querySelectorAll(
          "#hostPanel button"
        )
        .forEach(button => {

          button.disabled = false;

        });

    }


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    logoutButton.onclick =
      async () => {

        if (channel) {

          await supabase
            .removeChannel(channel);

          channel = null;

        }


        await supabase.auth
          .signOut();


        connected = false;

        sessionCodeValue = null;


        hostPanel.style.display =
          "none";

        loginPanel.style.display =
          "block";


        sessionCode.textContent =
          "--------";


        status.textContent =
          "Please log in.";

      };


    // --------------------------------------------------
    // CHECK EXISTING LOGIN
    // --------------------------------------------------

    const {
      data: {
        session
      }
    } =
      await supabase.auth
        .getSession();


    if (session) {

      showHost();

    }


    // --------------------------------------------------
    // ENABLE BUTTONS
    // --------------------------------------------------

    // setTimeout(
    //   enableControls,
    //   500
    // );

  </script>

</body>
</html>
