<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soundboard Host</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      padding: 30px;
    }

    input, button {
      font: inherit;
      padding: 10px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
    }

    button:disabled {
      cursor: not-allowed;
      opacity: 0.5;
    }

    #host {
      display: none;
    }

    .box {
      background: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-width: 700px;
    }

    .file {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }

    .file span {
      flex: 1;
      background: #444;
      padding: 10px;
      border-radius: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .file button {
      flex-shrink: 0;
    }

    #code {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #7cff7c;
    }

    #status {
      white-space: pre-wrap;
    }

    #userInfo {
      color: #aaa;
      margin-bottom: 15px;
    }

    .empty {
      color: #888;
      font-style: italic;
      padding: 10px 0;
    }

    .upload-row {
      margin-bottom: 15px;
    }

    .music-options {
      margin: 10px 0 15px 0;
      padding: 10px;
      background: #444;
      border-radius: 5px;
    }

    .music-options label {
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
    }

    .music-options input[type="checkbox"] {
      width: 18px;
      height: 18px;
      margin: 0;
    }
  </style>
</head>

<body>

<h1>🎲 Soundboard Host</h1>

<p id="status">Loading...</p>

<!-- LOGIN -->

<div id="login" class="box">

  <h2>Host Login</h2>

  <input
    id="email"
    type="email"
    placeholder="Email"
  >
  <br>

  <input
    id="password"
    type="password"
    placeholder="Password"
  >
  <br>

  <button id="loginButton">
    Login
  </button>

  <p id="loginMessage"></p>

</div>


<!-- HOST -->

<div id="host">

  <div class="box">

    <h2>Session</h2>

    <div id="userInfo"></div>

    <p>Give this code to the player:</p>

    <div id="code">--------</div>

    <button id="newCode">
      🔄 New Code
    </button>

    <button id="logout">
      Logout
    </button>

  </div>


  <div class="box">

    <h2>🔊 Sounds</h2>

    <div class="upload-row">

      <input
        id="soundUpload"
        type="file"
        accept="audio/*"
      >

      <button id="uploadSound">
        Upload Sound
      </button>

    </div>

    <div id="sounds"></div>

  </div>


  <div class="box">

    <h2>🎵 Music</h2>

    <div class="upload-row">

      <input
        id="musicUpload"
        type="file"
        accept="audio/*"
      >

      <button id="uploadMusic">
        Upload Music
      </button>

    </div>

    <div class="music-options">

      <label>
        <input
          id="musicLoop"
          type="checkbox"
        >
        🔁 Loop Music
      </label>

    </div>

    <div id="music"></div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// --------------------------------------------------
// SUPABASE
// --------------------------------------------------

const keys =
  await fetch("keys.json").then(r => r.json());

const supabase =
  createClient(
    keys.supabaseUrl,
    keys.supabaseKey
  );


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const status =
  document.getElementById("status");

const login =
  document.getElementById("login");

const host =
  document.getElementById("host");

const loginMessage =
  document.getElementById("loginMessage");

const codeElement =
  document.getElementById("code");

const sounds =
  document.getElementById("sounds");

const music =
  document.getElementById("music");

const userInfo =
  document.getElementById("userInfo");

const musicLoop =
  document.getElementById("musicLoop");


// --------------------------------------------------
// STATE
// --------------------------------------------------

let channel = null;

let sessionCode = null;

let uploadedSounds = [];

let uploadedMusic = [];


// --------------------------------------------------
// MUSIC LOOP SETTINGS
// --------------------------------------------------

const MUSIC_FADE_DURATION = 3;

const MUSIC_LOOP_OVERLAP = 3;


// --------------------------------------------------
// SESSION CODE
// --------------------------------------------------

function generateCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for (let i = 0; i < 8; i++) {

    result +=
      chars[
        Math.floor(
          Math.random() * chars.length
        )
      ];

  }

  return result;
}


// --------------------------------------------------
// GET CURRENT USER
// --------------------------------------------------

async function getCurrentUser() {

  const {
    data,
    error
  } =
    await supabase.auth.getUser();

  if (error) {

    console.error(error);

    return null;

  }

  return data.user;

}


// --------------------------------------------------
// LOAD USER LIBRARY
// --------------------------------------------------

async function loadLibrary() {

  const user =
    await getCurrentUser();

  if (!user) {

    uploadedSounds = [];
    uploadedMusic = [];

    renderSounds();
    renderMusic();

    return;

  }


  status.textContent =
    "Loading your library...";


  const {
    data,
    error
  } =
    await supabase
      .from("soundboard_files")
      .select("*")
      .eq("user_id", user.id)
      .order("created_at", {
        ascending: true
      });


  if (error) {

    console.error(error);

    status.textContent =
      "🔴 Failed to load library:\n" +
      error.message;

    return;

  }


  uploadedSounds =
    data.filter(
      file => file.type === "sound"
    );


  uploadedMusic =
    data.filter(
      file => file.type === "music"
    );


  renderSounds();
  renderMusic();


  status.textContent =
    "🟢 Library loaded";

}


// --------------------------------------------------
// CREATE SESSION
// --------------------------------------------------

async function createSession() {

  if (channel) {

    await supabase.removeChannel(
      channel
    );

    channel = null;

  }


  sessionCode =
    generateCode();


  codeElement.textContent =
    sessionCode;


  status.textContent =
    "Connecting...";


  channel =
    supabase.channel(
      "soundboard-" + sessionCode
    );


  channel.subscribe(
    state => {

      if (state === "SUBSCRIBED") {

        status.textContent =
          "🟢 Connected\n" +
          "Session: " +
          sessionCode;

      }

    }
  );

}


// --------------------------------------------------
// UPLOAD FILE
// --------------------------------------------------

async function uploadFile(
  input,
  type
) {

  const file =
    input.files[0];


  if (!file) {

    alert(
      "Choose an audio file first."
    );

    return;

  }


  const user =
    await getCurrentUser();


  if (!user) {

    alert(
      "You are not logged in."
    );

    return;

  }


  const path =
    user.id +
    "/" +
    Date.now() +
    "-" +
    file.name;


  status.textContent =
    "Uploading " +
    file.name +
    "...";


  // ------------------------------------------------
  // UPLOAD TO STORAGE
  // ------------------------------------------------

  const {
    error: uploadError
  } =
    await supabase.storage
      .from("soundboard")
      .upload(
        path,
        file
      );


  if (uploadError) {

    console.error(uploadError);

    status.textContent =
      "🔴 Upload failed:\n" +
      uploadError.message;

    return;

  }


  // ------------------------------------------------
  // SAVE LIBRARY RECORD
  // ------------------------------------------------

  const {
    data: libraryItem,
    error: dbError
  } =
    await supabase
      .from("soundboard_files")
      .insert({

        user_id: user.id,

        name: file.name,

        path: path,

        type: type

      })
      .select()
      .single();


  if (dbError) {

    console.error(dbError);


    // Remove uploaded file if database insert fails

    await supabase.storage
      .from("soundboard")
      .remove([
        path
      ]);


    status.textContent =
      "🔴 Could not save library item:\n" +
      dbError.message;

    return;

  }


  // ------------------------------------------------
  // ADD TO LOCAL LIBRARY
  // ------------------------------------------------

  if (type === "sound") {

    uploadedSounds.push(
      libraryItem
    );

    renderSounds();

  } else {

    uploadedMusic.push(
      libraryItem
    );

    renderMusic();

  }


  input.value = "";


  status.textContent =
    "🟢 Uploaded " +
    file.name;

}


// --------------------------------------------------
// CREATE SIGNED URL
// --------------------------------------------------

async function getSignedUrl(path) {

  /*
   * The Storage bucket is PRIVATE.
   *
   * This creates a temporary URL that
   * can be sent to the unauthenticated
   * player.
   */

  const {
    data,
    error
  } =
    await supabase.storage
      .from("soundboard")
      .createSignedUrl(
        path,
        60 * 10
      );


  if (error) {

    console.error(error);

    status.textContent =
      "🔴 Could not access audio:\n" +
      error.message;

    return null;

  }


  return data.signedUrl;

}


// --------------------------------------------------
// BROADCAST SOUND
// --------------------------------------------------

async function playSound(sound) {

  if (!channel) {

    alert(
      "No active player session."
    );

    return;

  }


  status.textContent =
    "Preparing " +
    sound.name +
    "...";


  const url =
    await getSignedUrl(
      sound.path
    );


  if (!url) return;


  const {
    error
  } =
    await channel.send({

      type: "broadcast",

      event: "play-sound",

      payload: {

        source: "supabase",

        file: sound.name,

        url: url

      }

    });


  if (error) {

    console.error(error);

    status.textContent =
      "🔴 Failed to send sound:\n" +
      error.message;

    return;

  }


  status.textContent =
    "▶ Playing " +
    sound.name;

}


// --------------------------------------------------
// BROADCAST MUSIC
// --------------------------------------------------

async function playMusic(song) {

  if (!channel) {

    alert(
      "No active player session."
    );

    return;

  }


  status.textContent =
    "Preparing " +
    song.name +
    "...";


  const url =
    await getSignedUrl(
      song.path
    );


  if (!url) return;


  const {
    error
  } =
    await channel.send({

      type: "broadcast",

      event: "play-music",

      payload: {

        source: "supabase",

        file: song.name,

        url: url,

        loop: musicLoop.checked,

        fadeIn: MUSIC_FADE_DURATION,

        fadeOut: MUSIC_FADE_DURATION,

        loopOverlap: MUSIC_LOOP_OVERLAP

      }

    });


  if (error) {

    console.error(error);

    status.textContent =
      "🔴 Failed to send music:\n" +
      error.message;

    return;

  }


  status.textContent =
    "▶ Playing " +
    song.name;

}


// --------------------------------------------------
// DELETE FILE
// --------------------------------------------------

async function deleteFile(item) {

  const confirmed =
    confirm(
      'Delete "' +
      item.name +
      '"?'
    );


  if (!confirmed) return;


  const user =
    await getCurrentUser();


  if (!user) {

    alert(
      "You are not logged in."
    );

    return;

  }


  status.textContent =
    "Deleting " +
    item.name +
    "...";


  // ------------------------------------------------
  // DELETE STORAGE FILE
  // ------------------------------------------------

  const {
    error: storageError
  } =
    await supabase.storage
      .from("soundboard")
      .remove([
        item.path
      ]);


  if (storageError) {

    console.error(storageError);

    status.textContent =
      "🔴 Could not delete file:\n" +
      storageError.message;

    return;

  }


  // ------------------------------------------------
  // DELETE DATABASE RECORD
  // ------------------------------------------------

  const {
    error: dbError
  } =
    await supabase
      .from("soundboard_files")
      .delete()
      .eq("id", item.id)
      .eq("user_id", user.id);


  if (dbError) {

    console.error(dbError);

    status.textContent =
      "🔴 File deleted but database cleanup failed:\n" +
      dbError.message;

    await loadLibrary();

    return;

  }


  // ------------------------------------------------
  // REMOVE FROM LOCAL ARRAYS
  // ------------------------------------------------

  if (item.type === "sound") {

    uploadedSounds =
      uploadedSounds.filter(
        sound => sound.id !== item.id
      );

    renderSounds();

  } else {

    uploadedMusic =
      uploadedMusic.filter(
        song => song.id !== item.id
      );

    renderMusic();

  }


  status.textContent =
    "🟢 Deleted " +
    item.name;

}


// --------------------------------------------------
// RENDER SOUNDS
// --------------------------------------------------

function renderSounds() {

  sounds.innerHTML = "";


  if (uploadedSounds.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "No saved sounds yet.";

    sounds.appendChild(empty);

    return;

  }


  uploadedSounds.forEach(
    sound => {

      const row =
        document.createElement("div");

      row.className =
        "file";


      const name =
        document.createElement("span");

      name.textContent =
        sound.name;


      const playButton =
        document.createElement("button");

      playButton.textContent =
        "▶ Play";

      playButton.onclick =
        () => playSound(sound);


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "🗑 Delete";

      deleteButton.onclick =
        () => deleteFile(sound);


      row.appendChild(name);

      row.appendChild(playButton);

      row.appendChild(deleteButton);


      sounds.appendChild(row);

    }
  );

}


// --------------------------------------------------
// RENDER MUSIC
// --------------------------------------------------

function renderMusic() {

  music.innerHTML = "";


  if (uploadedMusic.length === 0) {

    const empty =
      document.createElement("div");

    empty.className =
      "empty";

    empty.textContent =
      "No saved music yet.";

    music.appendChild(empty);

    return;

  }


  uploadedMusic.forEach(
    song => {

      const row =
        document.createElement("div");

      row.className =
        "file";


      const name =
        document.createElement("span");

      name.textContent =
        song.name;


      const playButton =
        document.createElement("button");

      playButton.textContent =
        "▶ Play";

      playButton.onclick =
        () => playMusic(song);


      const deleteButton =
        document.createElement("button");

      deleteButton.textContent =
        "🗑 Delete";

      deleteButton.onclick =
        () => deleteFile(song);


      row.appendChild(name);

      row.appendChild(playButton);

      row.appendChild(deleteButton);


      music.appendChild(row);

    }
  );

}


// --------------------------------------------------
// SHOW HOST
// --------------------------------------------------

async function showHost(user) {

  login.style.display =
    "none";

  host.style.display =
    "block";


  userInfo.textContent =
    "Logged in as: " +
    user.email;


  await loadLibrary();

  await createSession();

}


// --------------------------------------------------
// LOGIN
// --------------------------------------------------

document
  .getElementById("loginButton")
  .onclick =
  async () => {

    const email =
      document
        .getElementById("email")
        .value
        .trim();


    const password =
      document
        .getElementById("password")
        .value;


    loginMessage.textContent =
      "Logging in...";


    const {
      data,
      error
    } =
    await supabase.auth
      .signInWithPassword({

        email,

        password

      });


    if (error) {

      loginMessage.textContent =
        error.message;

      return;

    }


    loginMessage.textContent =
      "";


    await showHost(
      data.user
    );

};


// --------------------------------------------------
// NEW CODE
// --------------------------------------------------

document
  .getElementById("newCode")
  .onclick =
  createSession;


// --------------------------------------------------
// UPLOAD SOUND
// --------------------------------------------------

document
  .getElementById("uploadSound")
  .onclick =
  () =>
    uploadFile(
      document.getElementById(
        "soundUpload"
      ),
      "sound"
    );


// --------------------------------------------------
// UPLOAD MUSIC
// --------------------------------------------------

document
  .getElementById("uploadMusic")
  .onclick =
  () =>
    uploadFile(
      document.getElementById(
        "musicUpload"
      ),
      "music"
    );


// --------------------------------------------------
// LOGOUT
// --------------------------------------------------

document
  .getElementById("logout")
  .onclick =
  async () => {

    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel = null;

    }


    await supabase.auth.signOut();


    uploadedSounds = [];

    uploadedMusic = [];


    renderSounds();

    renderMusic();


    host.style.display =
      "none";

    login.style.display =
      "block";


    codeElement.textContent =
      "--------";


    userInfo.textContent =
      "";


    loginMessage.textContent =
      "";


    status.textContent =
      "Please log in.";

  };


// --------------------------------------------------
// EXISTING SESSION
// --------------------------------------------------

const {
  data
} =
  await supabase.auth.getSession();


if (data.session) {

  await showHost(
    data.session.user
  );

} else {

  status.textContent =
    "Please log in.";

}

</script>

</body>
</html>
