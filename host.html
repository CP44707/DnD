```html
<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Soundboard</h1>

  <div id="sounds"></div>

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // Load Supabase settings
    const keys = await fetch("keys.json").then(response => response.json());

    const supabase = createClient(
      keys.supabaseUrl,
      keys.supabaseKey
    );


    // Connect to soundboard
    const channel = supabase.channel("soundboard");

    channel.subscribe();


    // Load sounds
    const files = await fetch("sounds.json").then(response => response.json());

    const container = document.getElementById("sounds");

    files.forEach(file => {

      const button = document.createElement("button");

      const name = file
        .replace(".mp3", "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());

      button.textContent = name;


      button.onclick = async () => {

        await channel.send({
          type: "broadcast",
          event: "play-sound",
          payload: {
            file: file
          }
        });

      };


      container.appendChild(button);

    });

  </script>

</body>
</html>
```
