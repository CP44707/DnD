<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    input {
      padding: 12px;
      font-size: 16px;
      box-sizing: border-box;
    }

    button {
      font-family: inherit;
    }

    #status {
      margin-bottom: 20px;
      white-space: pre-wrap;
    }

    #loginPanel {
      max-width: 400px;
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
    }

    #loginPanel input {
      width: 100%;
      margin-bottom: 10px;
    }

    #loginButton,
    #logoutButton,
    #newCodeButton,
    #copyCodeButton {
      padding: 12px 18px;
      font-size: 16px;
      cursor: pointer;
      margin-right: 6px;
      margin-bottom: 10px;
    }

    #hostPanel {
      display: none;
    }

    #sessionPanel {
      background: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 25px;
    }

    #sessionCode {
      font-size: 34px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #7cff7c;
    }

    #columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .column {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .sound-button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .music-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .music-name {
      padding: 12px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-button {
      padding: 12px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .repeat-active {
      background: #4caf50;
      color: white;
    }

    #loginMessage {
      color: #ff7777;
      white-space: pre-wrap;
    }

    @media (max-width: 700px) {
      #columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>🎲 Host Soundboard</h1>

  <p id="status">Loading...</p>


  <!-- LOGIN -->

  <div id="loginPanel">

    <h2>Host Login</h2>

    <input
      id="email"
      type="email"
      placeholder="Email"
      autocomplete="username"
    >

    <input
      id="password"
      type="password"
      placeholder="Password"
      autocomplete="current-password"
    >

    <button id="loginButton">
      Login
    </button>

    <p id="loginMessage"></p>

  </div>


  <!-- HOST -->

  <div id="hostPanel">

    <div id="sessionPanel">

      <h2>🎲 Session</h2>

      <p>
        Give this code to your players:
      </p>

      <div id="sessionCode">
        --------
      </div>

      <br>

      <button id="copyCodeButton">
        📋 Copy Code
      </button>

      <button id="newCodeButton">
        🔄 New Code
      </button>

      <button id="logoutButton">
        Logout
      </button>

    </div>


    <div id="columns">

      <!-- SOUNDS -->

      <div class="column">

        <h2>🔊 Sounds</h2>

        <div id="sounds"></div>

      </div>


      <!-- MUSIC -->

      <div class="column">

        <h2>🎵 Music</h2>

        <div id="music"></div>

      </div>

    </div>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const status =
      document.getElementById("status");

    const loginPanel =
      document.getElementById("loginPanel");

    const hostPanel =
      document.getElementById("hostPanel");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const newCodeButton =
      document.getElementById("newCodeButton");

    const copyCodeButton =
      document.getElementById("copyCodeButton");

    const sessionCode =
      document.getElementById("sessionCode");

    const soundsContainer =
      document.getElementById("sounds");

    const musicContainer =
      document.getElementById("music");

    const loginMessage =
      document.getElementById("loginMessage");


    // --------------------------------------------------
    // STATE
    // --------------------------------------------------

    let supabase = null;

    let channel = null;

    let connected = false;

    let sessionCodeValue = null;


    // --------------------------------------------------
    // FORMAT FILE NAME
    // --------------------------------------------------

    function displayName(file) {

      return file
        .replace(
          /\.(mp3|wav|ogg|m4a)$/i,
          ""
        )
        .replace(
          /[-_]/g,
          " "
        )
        .replace(
          /\b\w/g,
          letter =>
            letter.toUpperCase()
        );

    }


    // --------------------------------------------------
    // GENERATE SESSION CODE
    // --------------------------------------------------

    function generateCode() {

      const characters =
        "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

      let code = "";

      for (let i = 0; i < 8; i++) {

        code +=
          characters[
            Math.floor(
              Math.random() *
              characters.length
            )
          ];

      }

      return code;

    }


    // --------------------------------------------------
    // ENABLE CONTROLS
    // --------------------------------------------------

    function enableControls() {

      document
        .querySelectorAll(
          ".sound-button, .music-button"
        )
        .forEach(button => {

          button.disabled = false;

        });

    }


    // --------------------------------------------------
    // DISABLE CONTROLS
    // --------------------------------------------------

    function disableControls() {

      document
        .querySelectorAll(
          ".sound-button, .music-button"
        )
        .forEach(button => {

          button.disabled = true;

        });

    }


    // --------------------------------------------------
    // INITIALIZE SUPABASE
    // --------------------------------------------------

    async function initializeSupabase() {

      try {

        const response =
          await fetch("keys.json");


        if (!response.ok) {

          throw new Error(
            "Could not load keys.json"
          );

        }


        const keys =
          await response.json();


        if (
          !keys.supabaseUrl ||
          !keys.supabaseKey
        ) {

          throw new Error(
            "keys.json is missing supabaseUrl or supabaseKey."
          );

        }


        supabase =
          createClient(
            keys.supabaseUrl,
            keys.supabaseKey
          );


        status.textContent =
          "Please log in.";


        checkExistingLogin();

      } catch (error) {

        console.error(error);


        status.textContent =
          "🔴 Could not initialize Supabase.\n\n" +
          error.message;

      }

    }


    // --------------------------------------------------
    // LOGIN
    // --------------------------------------------------

    loginButton.onclick =
      async () => {

        if (!supabase) {

          loginMessage.textContent =
            "Supabase is not ready yet.";

          return;

        }


        const email =
          document
            .getElementById("email")
            .value
            .trim();

        const password =
          document
            .getElementById("password")
            .value;


        if (!email || !password) {

          loginMessage.textContent =
            "Enter your email and password.";

          return;

        }


        loginButton.disabled = true;


        loginMessage.textContent =
          "Logging in...";


        try {

          const {
            error
          } =
            await supabase.auth
              .signInWithPassword({

                email,
                password

              });


          if (error) {

            loginMessage.textContent =
              "Login failed: " +
              error.message;

            loginButton.disabled =
              false;

            return;

          }


          loginMessage.textContent =
            "";


          await showHost();


        } catch (error) {

          console.error(error);


          loginMessage.textContent =
            "Login failed:\n" +
            error.message;

        }


        loginButton.disabled = false;

      };


    // --------------------------------------------------
    // CHECK EXISTING LOGIN
    // --------------------------------------------------

    async function checkExistingLogin() {

      try {

        const {
          data
        } =
          await supabase.auth
            .getSession();


        if (
          data &&
          data.session
        ) {

          await showHost();

        }

      } catch (error) {

        console.error(
          "Session check failed:",
          error
        );

      }

    }


    // --------------------------------------------------
    // SHOW HOST
    // --------------------------------------------------

    async function showHost() {

      loginPanel.style.display =
        "none";

      hostPanel.style.display =
        "block";


      status.textContent =
        "🟡 Loading soundboard...";


      disableControls();


      try {

        await loadSounds();

      } catch (error) {

        console.error(
          "Could not load sounds:",
          error
        );

        status.textContent =
          "🔴 Could not load sounds.json.";

        return;

      }


      try {

        await loadMusic();

      } catch (error) {

        console.error(
          "Could not load music:",
          error
        );

        status.textContent =
          "🔴 Could not load music.json.";

        return;

      }


      await createSession();

    }


    // --------------------------------------------------
    // CREATE SESSION
    // --------------------------------------------------

    async function createSession() {

      newCodeButton.disabled = true;

      copyCodeButton.disabled = true;

      disableControls();


      connected = false;


      if (channel) {

        try {

          await supabase
            .removeChannel(channel);

        } catch (error) {

          console.warn(
            "Could not remove old channel:",
            error
          );

        }


        channel = null;

      }


      sessionCodeValue =
        generateCode();


      sessionCode.textContent =
        sessionCodeValue;


      status.textContent =
        "🟡 Connecting...";


      channel =
        supabase.channel(
          "soundboard-" +
          sessionCodeValue,
          {
            config: {
              broadcast: {
                self: false
              }
            }
          }
        );


      channel.subscribe(
        (state, error) => {

          console.log(
            "Host channel state:",
            state,
            error
          );


          if (
            state === "SUBSCRIBED"
          ) {

            connected = true;


            status.textContent =
              "🟢 Connected\n" +
              "Session code: " +
              sessionCodeValue;


            enableControls();


            newCodeButton.disabled =
              false;

            copyCodeButton.disabled =
              false;


            return;

          }


          if (
            state === "CHANNEL_ERROR"
          ) {

            connected = false;


            disableControls();


            status.textContent =
              "🔴 Realtime channel error.\n\n" +
              "Check the browser console for details.";


            newCodeButton.disabled =
              false;


            console.error(
              "Supabase channel error:",
              error
            );


            return;

          }


          if (
            state === "TIMED_OUT"
          ) {

            connected = false;


            disableControls();


            status.textContent =
              "🔴 Connection timed out.\n\n" +
              "Trying again...";


            reconnectCurrentSession();


            return;

          }


          if (
            state === "CLOSED"
          ) {

            connected = false;


            disableControls();

          }

        }
      );

    }


    // --------------------------------------------------
    // RECONNECT
    // --------------------------------------------------

    async function reconnectCurrentSession() {

      if (!sessionCodeValue)
        return;


      if (!supabase)
        return;


      if (channel) {

        try {

          await supabase
            .removeChannel(channel);

        } catch (error) {

          console.warn(error);

        }


        channel = null;

      }


      await new Promise(
        resolve =>
          setTimeout(
            resolve,
            1000
          )
      );


      connected = false;


      channel =
        supabase.channel(
          "soundboard-" +
          sessionCodeValue,
          {
            config: {
              broadcast: {
                self: false
              }
            }
          }
        );


      channel.subscribe(
        (state, error) => {

          console.log(
            "Host reconnect:",
            state,
            error
          );


          if (
            state === "SUBSCRIBED"
          ) {

            connected = true;


            status.textContent =
              "🟢 Connected\n" +
              "Session code: " +
              sessionCodeValue;


            enableControls();


            newCodeButton.disabled =
              false;

            copyCodeButton.disabled =
              false;

          }


          if (
            state === "CHANNEL_ERROR"
          ) {

            connected = false;


            disableControls();


            status.textContent =
              "🔴 Realtime channel error.";

            console.error(error);

          }


          if (
            state === "TIMED_OUT"
          ) {

            connected = false;


            disableControls();


            status.textContent =
              "🔴 Connection timed out.\n" +
              "Click New Code to try again.";

          }

        }
      );

    }


    // --------------------------------------------------
    // COPY CODE
    // --------------------------------------------------

    copyCodeButton.onclick =
      async () => {

        if (!sessionCodeValue)
          return;


        try {

          await navigator
            .clipboard
            .writeText(
              sessionCodeValue
            );


          copyCodeButton.textContent =
            "✅ Copied!";


          setTimeout(() => {

            copyCodeButton.textContent =
              "📋 Copy Code";

          }, 1500);


        } catch (error) {

          console.error(error);


          alert(
            "Your session code is:\n\n" +
            sessionCodeValue
          );

        }

      };


    // --------------------------------------------------
    // NEW CODE
    // --------------------------------------------------

    newCodeButton.onclick =
      async () => {

        if (!supabase)
          return;


        await createSession();

      };


    // --------------------------------------------------
    // PLAY SOUND
    // --------------------------------------------------

    async function playSound(file) {

      if (
        !connected ||
        !channel
      ) {

        console.warn(
          "Cannot play sound: not connected."
        );

        return;

      }


      console.log(
        "Sending sound:",
        file
      );


      try {

        const result =
          await channel.send({

            type: "broadcast",

            event: "play-sound",

            payload: {

              source: "github",

              file: file

            }

          });


        console.log(
          "Sound result:",
          result
        );


      } catch (error) {

        console.error(
          "Sound send failed:",
          error
        );

      }

    }


    // --------------------------------------------------
    // PLAY MUSIC
    // --------------------------------------------------

    async function playMusic(file) {

      if (
        !connected ||
        !channel
      ) {

        console.warn(
          "Cannot play music: not connected."
        );

        return;

      }


      console.log(
        "Sending music:",
        file
      );


      try {

        const result =
          await channel.send({

            type: "broadcast",

            event: "play-music",

            payload: {

              source: "github",

              file: file

            }

          });


        console.log(
          "Music result:",
          result
        );


      } catch (error) {

        console.error(
          "Music send failed:",
          error
        );

      }

    }


    // --------------------------------------------------
    // PAUSE MUSIC
    // --------------------------------------------------

    async function pauseMusic() {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      try {

        await channel.send({

          type: "broadcast",

          event: "pause-music",

          payload: {}

        });

      } catch (error) {

        console.error(
          "Pause failed:",
          error
        );

      }

    }


    // --------------------------------------------------
    // REPEAT MUSIC
    // --------------------------------------------------

    async function toggleRepeat(
      file,
      repeat
    ) {

      if (
        !connected ||
        !channel
      ) {

        return;

      }


      try {

        await channel.send({

          type: "broadcast",

          event: "repeat-music",

          payload: {

            source: "github",

            file: file,

            repeat: repeat

          }

        });

      } catch (error) {

        console.error(
          "Repeat command failed:",
          error
        );

      }

    }


    // --------------------------------------------------
    // LOAD SOUNDS
    // --------------------------------------------------

    async function loadSounds() {

      soundsContainer.innerHTML =
        "";


      const response =
        await fetch(
          "sounds.json",
          {
            cache: "no-cache"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Could not load sounds.json"
        );

      }


      const files =
        await response.json();


      if (!Array.isArray(files)) {

        throw new Error(
          "sounds.json must contain an array."
        );

      }


      files.forEach(file => {

        const button =
          document.createElement(
            "button"
          );


        button.className =
          "sound-button";


        button.textContent =
          displayName(file);


        button.disabled =
          !connected;


        button.onclick =
          () => {

            playSound(file);

          };


        soundsContainer.appendChild(
          button
        );

      });

    }


    // --------------------------------------------------
    // LOAD MUSIC
    // --------------------------------------------------

    async function loadMusic() {

      musicContainer.innerHTML =
        "";


      const response =
        await fetch(
          "music.json",
          {
            cache: "no-cache"
          }
        );


      if (!response.ok) {

        throw new Error(
          "Could not load music.json"
        );

      }


      const files =
        await response.json();


      if (!Array.isArray(files)) {

        throw new Error(
          "music.json must contain an array."
        );

      }


      files.forEach(file => {

        const item =
          document.createElement(
            "div"
          );


        item.className =
          "music-item";


        const nameElement =
          document.createElement(
            "div"
          );


        nameElement.className =
          "music-name";


        nameElement.textContent =
          displayName(file);


        const playButton =
          document.createElement(
            "button"
          );


        playButton.className =
          "music-button";


        playButton.textContent =
          "▶";


        playButton.disabled =
          !connected;


        playButton.onclick =
          () => {

            playMusic(file);

          };


        const pauseButton =
          document.createElement(
            "button"
          );


        pauseButton.className =
          "music-button";


        pauseButton.textContent =
          "⏸";


        pauseButton.disabled =
          !connected;


        pauseButton.onclick =
          () => {

            pauseMusic();

          };


        const repeatButton =
          document.createElement(
            "button"
          );


        repeatButton.className =
          "music-button";


        repeatButton.textContent =
          "🔁";


        repeatButton.disabled =
          !connected;


        let repeating = false;


        repeatButton.onclick =
          () => {

            repeating =
              !repeating;


            repeatButton.classList.toggle(
              "repeat-active",
              repeating
            );


            toggleRepeat(
              file,
              repeating
            );

          };


        item.appendChild(
          nameElement
        );


        item.appendChild(
          playButton
        );


        item.appendChild(
          pauseButton
        );


        item.appendChild(
          repeatButton
        );


        musicContainer.appendChild(
          item
        );

      });

    }


    // --------------------------------------------------
    // LOGOUT
    // --------------------------------------------------

    logoutButton.onclick =
      async () => {

        try {

          if (channel) {

            await supabase
              .removeChannel(channel);

            channel = null;

          }


          await supabase.auth
            .signOut();


        } catch (error) {

          console.error(
            "Logout error:",
            error
          );

        }


        connected = false;

        sessionCodeValue = null;


        disableControls();


        hostPanel.style.display =
          "none";


        loginPanel.style.display =
          "block";


        sessionCode.textContent =
          "--------";


        status.textContent =
          "Please log in.";


        loginMessage.textContent =
          "";

      };


    // --------------------------------------------------
    // START
    // --------------------------------------------------

    initializeSupabase();

  </script>

</body>
</html>
