<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    #status {
      margin-bottom: 20px;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
  </style>
</head>

<body>

  <h1>Soundboard</h1>

  <p id="status">Connecting...</p>

  <div id="sounds"></div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // Load Supabase keys
    const keys = await fetch("keys.json").then(r => r.json());


    // Create Supabase client
    const supabase = createClient(
      keys.supabaseUrl,
      keys.supabaseKey
    );


    const status = document.getElementById("status");
    const container = document.getElementById("sounds");


    let connected = false;


    // IMPORTANT:
    // Host and player must use the SAME channel name.
    const channel = supabase.channel("soundboard");


    // Connect to Supabase Realtime
    channel.subscribe((state, error) => {

      console.log("Supabase:", state);
      console.log("Error:", error);


      if (state === "SUBSCRIBED") {

        connected = true;

        status.textContent = "🟢 Connected";

        document
          .querySelectorAll("button")
          .forEach(button => {
            button.disabled = false;
          });
      }


      if (state === "CHANNEL_ERROR") {

        connected = false;

        status.textContent = "🔴 Connection error";

        console.error(error);
      }


      if (state === "TIMED_OUT") {

        connected = false;

        status.textContent = "🔴 Connection timed out";
      }

    });


    // Load sound filenames
    const files = await fetch("sounds.json").then(r => r.json());


    // Create buttons
    files.forEach(file => {

      const button = document.createElement("button");


      const name = file
        .replace(/\.(mp3|wav|ogg)$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());


      button.textContent = name;

      button.disabled = true;


      button.onclick = async () => {

        if (!connected) {

          console.warn("Not connected yet.");

          return;
        }


        console.log("Sending:", file);


        const result = await channel.send({

          type: "broadcast",

          event: "play-sound",

          payload: {
            file: file
          }

        });


        console.log("Send result:", result);


        if (result !== "ok") {

          console.error(
            "Failed to send sound:",
            result
          );

        }

      };


      container.appendChild(button);

    });

  </script>

</body>
</html>
