<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    h1 {
      margin-bottom: 20px;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 10px;
    }

    button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }
  </style>
</head>

<body>

  <h1>Soundboard</h1>

  <div id="sounds"></div>

  <script>
    fetch("sounds.json")
      .then(response => response.json())
      .then(files => {
        const container = document.getElementById("sounds");

        files.forEach(file => {
          const button = document.createElement("button");

          // Turn "door-open.mp3" into "Door Open"
          const name = file
            .replace(".mp3", "")
            .replace(/[-_]/g, " ")
            .replace(/\b\w/g, letter => letter.toUpperCase());

          button.textContent = name;

          button.onclick = () => {
            console.log("Play:", file);

            // We'll replace this with the real-time
            // Host → Player code next.
          };

          container.appendChild(button);
        });
      })
      .catch(error => {
        console.error("Could not load sounds.json:", error);
      });
  </script>

</body>
</html>
