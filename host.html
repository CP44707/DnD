<!DOCTYPE html>
<html>
<head>
  <title>Host</title>
</head>
<body>
  <input id="host" placeholder="Enter text">
  <iframe src="https://app.roll20.net/..."></iframe>

  <script>
    const input = document.getElementById("host");

    input.addEventListener("input", () => {
      localStorage.setItem("hostText", input.value);
    });
  </script>
</body>
</html>
