<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soundboard Host</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      padding: 30px;
    }

    input, button {
      font: inherit;
      padding: 10px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
    }

    #host {
      display: none;
    }

    .box {
      background: #333;
      padding: 20px;
      border-radius: 10px;
      margin-bottom: 20px;
      max-width: 700px;
    }

    .file {
      display: flex;
      gap: 10px;
      align-items: center;
      margin: 8px 0;
    }

    .file span {
      flex: 1;
      background: #444;
      padding: 10px;
      border-radius: 5px;
    }

    #code {
      font-size: 36px;
      font-weight: bold;
      letter-spacing: 6px;
      color: #7cff7c;
    }

    #status {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>🎲 Soundboard Host</h1>

<p id="status">Loading...</p>

<!-- LOGIN -->

<div id="login" class="box">

  <h2>Host Login</h2>

  <input id="email" type="email" placeholder="Email">
  <br>

  <input id="password" type="password" placeholder="Password">
  <br>

  <button id="loginButton">Login</button>

  <p id="loginMessage"></p>

</div>


<!-- HOST -->

<div id="host">

  <div class="box">

    <h2>Session</h2>

    <p>Give this code to the player:</p>

    <div id="code">--------</div>

    <button id="newCode">🔄 New Code</button>
    <button id="logout">Logout</button>

  </div>


  <div class="box">

    <h2>🔊 Sounds</h2>

    <input
      id="soundUpload"
      type="file"
      accept="audio/*"
    >

    <button id="uploadSound">
      Upload Sound
    </button>

    <div id="sounds"></div>

  </div>


  <div class="box">

    <h2>🎵 Music</h2>

    <input
      id="musicUpload"
      type="file"
      accept="audio/*"
    >

    <button id="uploadMusic">
      Upload Music
    </button>

    <div id="music"></div>

  </div>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// --------------------------------------------------
// SUPABASE
// --------------------------------------------------

const keys =
  await fetch("keys.json").then(r => r.json());

const supabase =
  createClient(
    keys.supabaseUrl,
    keys.supabaseKey
  );


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const status =
  document.getElementById("status");

const login =
  document.getElementById("login");

const host =
  document.getElementById("host");

const loginMessage =
  document.getElementById("loginMessage");

const codeElement =
  document.getElementById("code");

const sounds =
  document.getElementById("sounds");

const music =
  document.getElementById("music");


// --------------------------------------------------
// STATE
// --------------------------------------------------

let channel = null;

let sessionCode = null;

let uploadedSounds = [];

let uploadedMusic = [];


// --------------------------------------------------
// SESSION CODE
// --------------------------------------------------

function generateCode() {

  const chars =
    "ABCDEFGHJKLMNPQRSTUVWXYZ23456789";

  let result = "";

  for (let i = 0; i < 8; i++) {

    result +=
      chars[
        Math.floor(
          Math.random() * chars.length
        )
      ];

  }

  return result;
}


// --------------------------------------------------
// CREATE SESSION
// --------------------------------------------------

async function createSession() {

  if (channel) {

    await supabase.removeChannel(channel);

  }

  sessionCode =
    generateCode();

  codeElement.textContent =
    sessionCode;

  status.textContent =
    "Connecting...";

  channel =
    supabase.channel(
      "soundboard-" + sessionCode
    );

  channel.subscribe(
    state => {

      if (state === "SUBSCRIBED") {

        status.textContent =
          "🟢 Connected\n" +
          "Session: " +
          sessionCode;

      }

    }
  );

}


// --------------------------------------------------
// UPLOAD
// --------------------------------------------------

async function uploadFile(
  input,
  type
) {

  const file =
    input.files[0];

  if (!file) {

    alert("Choose an audio file first.");

    return;

  }


  const {
    data: {
      user
    }
  } =
    await supabase.auth.getUser();


  if (!user) {

    alert("You are not logged in.");

    return;

  }


  const path =
    user.id +
    "/" +
    Date.now() +
    "-" +
    file.name;


  status.textContent =
    "Uploading " +
    file.name +
    "...";


  const {
    error
  } =
    await supabase.storage
      .from("soundboard")
      .upload(
        path,
        file
      );


  if (error) {

    console.error(error);

    status.textContent =
      "🔴 Upload failed:\n" +
      error.message;

    return;

  }


  const {
    data
  } =
    supabase.storage
      .from("soundboard")
      .getPublicUrl(path);


  const item = {

    name: file.name,

    path: path,

    url: data.publicUrl

  };


  if (type === "sound") {

    uploadedSounds.push(item);

    renderSounds();

  } else {

    uploadedMusic.push(item);

    renderMusic();

  }


  input.value = "";

  status.textContent =
    "🟢 Uploaded " +
    file.name;

}


// --------------------------------------------------
// BROADCAST SOUND
// --------------------------------------------------

async function playSound(sound) {

  if (!channel) return;

  await channel.send({

    type: "broadcast",

    event: "play-sound",

    payload: {

      source: "supabase",

      file: sound.name,

      url: sound.url

    }

  });

}


// --------------------------------------------------
// BROADCAST MUSIC
// --------------------------------------------------

async function playMusic(song) {

  if (!channel) return;

  await channel.send({

    type: "broadcast",

    event: "play-music",

    payload: {

      source: "supabase",

      file: song.name,

      url: song.url

    }

  });

}


// --------------------------------------------------
// RENDER SOUNDS
// --------------------------------------------------

function renderSounds() {

  sounds.innerHTML = "";

  uploadedSounds.forEach(sound => {

    const row =
      document.createElement("div");

    row.className = "file";


    const name =
      document.createElement("span");

    name.textContent =
      sound.name;


    const button =
      document.createElement("button");

    button.textContent =
      "▶ Play";

    button.onclick =
      () => playSound(sound);


    row.appendChild(name);

    row.appendChild(button);

    sounds.appendChild(row);

  });

}


// --------------------------------------------------
// RENDER MUSIC
// --------------------------------------------------

function renderMusic() {

  music.innerHTML = "";

  uploadedMusic.forEach(song => {

    const row =
      document.createElement("div");

    row.className = "file";


    const name =
      document.createElement("span");

    name.textContent =
      song.name;


    const button =
      document.createElement("button");

    button.textContent =
      "▶ Play";

    button.onclick =
      () => playMusic(song);


    row.appendChild(name);

    row.appendChild(button);

    music.appendChild(row);

  });

}


// --------------------------------------------------
// LOGIN
// --------------------------------------------------

document
  .getElementById("loginButton")
  .onclick =
  async () => {

    const email =
      document.getElementById("email")
        .value
        .trim();

    const password =
      document.getElementById("password")
        .value;


    loginMessage.textContent =
      "Logging in...";


    const {
      error
    } =
      await supabase.auth
        .signInWithPassword({

          email,
          password

        });


    if (error) {

      loginMessage.textContent =
        error.message;

      return;

    }


    login.style.display =
      "none";

    host.style.display =
      "block";


    await createSession();

  };


// --------------------------------------------------
// NEW CODE
// --------------------------------------------------

document
  .getElementById("newCode")
  .onclick =
  createSession;


// --------------------------------------------------
// UPLOAD BUTTONS
// --------------------------------------------------

document
  .getElementById("uploadSound")
  .onclick =
  () =>
    uploadFile(
      document.getElementById("soundUpload"),
      "sound"
    );


document
  .getElementById("uploadMusic")
  .onclick =
  () =>
    uploadFile(
      document.getElementById("musicUpload"),
      "music"
    );


// --------------------------------------------------
// LOGOUT
// --------------------------------------------------

document
  .getElementById("logout")
  .onclick =
  async () => {

    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel = null;

    }

    await supabase.auth.signOut();

    host.style.display =
      "none";

    login.style.display =
      "block";

    codeElement.textContent =
      "--------";

    status.textContent =
      "Please log in.";

  };


// --------------------------------------------------
// EXISTING SESSION
// --------------------------------------------------

const {
  data
} =
  await supabase.auth.getSession();


if (data.session) {

  login.style.display =
    "none";

  host.style.display =
    "block";

  await createSession();

} else {

  status.textContent =
    "Please log in.";

}

</script>

</body>
</html>
