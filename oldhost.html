<!DOCTYPE html>
<html>
<head>
  <title>Host Soundboard</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    #status {
      margin-bottom: 20px;
    }

    #columns {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 30px;
      align-items: start;
    }

    .column {
      background: #2d2d2d;
      padding: 20px;
      border-radius: 10px;
    }

    h2 {
      margin-top: 0;
      border-bottom: 1px solid #555;
      padding-bottom: 10px;
    }

    #sounds {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(130px, 1fr));
      gap: 10px;
    }

    .sound-button {
      padding: 20px;
      font-size: 18px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    .music-item {
      display: grid;
      grid-template-columns: 1fr auto auto auto;
      gap: 6px;
      align-items: center;
      margin-bottom: 10px;
    }

    .music-name {
      padding: 12px;
      background: #444;
      border-radius: 5px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .music-button {
      padding: 12px 15px;
      font-size: 16px;
      cursor: pointer;
    }

    .repeat-active {
      background: #4caf50;
      color: white;
    }

    @media (max-width: 700px) {
      #columns {
        grid-template-columns: 1fr;
      }
    }
  </style>
</head>

<body>

  <h1>Soundboard</h1>

  <p id="status">Connecting...</p>

  <div id="columns">

    <!-- SOUNDS -->
    <div class="column">

      <h2>🔊 Sounds</h2>

      <div id="sounds"></div>

    </div>


    <!-- MUSIC -->
    <div class="column">

      <h2>🎵 Music</h2>

      <div id="music"></div>

    </div>

  </div>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const keys = await fetch("keys.json").then(r => r.json());

    const supabase = createClient(
      keys.supabaseUrl,
      keys.supabaseKey
    );


    const status = document.getElementById("status");
    const soundsContainer = document.getElementById("sounds");
    const musicContainer = document.getElementById("music");


    let connected = false;


    // IMPORTANT:
    // Host and player use the same channel.
    const channel = supabase.channel("soundboard");


    // --------------------------------------------------
    // CONNECT
    // --------------------------------------------------

    channel.subscribe((state, error) => {

      console.log("Supabase:", state);
      console.log("Error:", error);


      if (state === "SUBSCRIBED") {

        connected = true;

        status.textContent = "🟢 Connected";

        document
          .querySelectorAll("button")
          .forEach(button => {
            button.disabled = false;
          });

      }


      if (state === "CHANNEL_ERROR") {

        connected = false;

        status.textContent = "🔴 Connection error";

        console.error(error);

      }


      if (state === "TIMED_OUT") {

        connected = false;

        status.textContent = "🔴 Connection timed out";

      }

    });


    // --------------------------------------------------
    // SEND SOUND
    // --------------------------------------------------

    async function playSound(file) {

      if (!connected) {
        console.warn("Not connected.");
        return;
      }


      console.log("Sending sound:", file);


      const result = await channel.send({

        type: "broadcast",

        event: "play-sound",

        payload: {
          file: file
        }

      });


      console.log("Sound result:", result);

    }


    // --------------------------------------------------
    // SEND MUSIC
    // --------------------------------------------------

    async function playMusic(file) {

      if (!connected) {
        console.warn("Not connected.");
        return;
      }


      console.log("Playing music:", file);


      const result = await channel.send({

        type: "broadcast",

        event: "play-music",

        payload: {
          file: file
        }

      });


      console.log("Music result:", result);

    }


    async function pauseMusic() {

      if (!connected) return;


      console.log("Pausing music");


      await channel.send({

        type: "broadcast",

        event: "pause-music",

        payload: {}

      });

    }


    async function toggleRepeat(file, repeat) {

      if (!connected) return;


      console.log(
        "Repeat:",
        file,
        repeat
      );


      await channel.send({

        type: "broadcast",

        event: "repeat-music",

        payload: {
          file: file,
          repeat: repeat
        }

      });

    }


    // --------------------------------------------------
    // LOAD SOUNDS
    // --------------------------------------------------

    const files = await fetch("sounds.json").then(r => r.json());


    files.forEach(file => {

      const button = document.createElement("button");

      button.className = "sound-button";


      const name = file
        .replace(/\.(mp3|wav|ogg|m4a)$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());


      button.textContent = name;

      button.disabled = true;


      button.onclick = () => {

        playSound(file);

      };


      soundsContainer.appendChild(button);

    });


    // --------------------------------------------------
    // LOAD MUSIC
    // --------------------------------------------------

    const musicFiles =
      await fetch("music.json").then(r => r.json());


    musicFiles.forEach(file => {

      const item = document.createElement("div");

      item.className = "music-item";


      const name = file
        .replace(/\.(mp3|wav|ogg|m4a)$/i, "")
        .replace(/[-_]/g, " ")
        .replace(/\b\w/g, letter => letter.toUpperCase());


      // Song name
      const nameElement = document.createElement("div");

      nameElement.className = "music-name";

      nameElement.textContent = name;


      // Play button
      const playButton = document.createElement("button");

      playButton.className = "music-button";

      playButton.textContent = "▶";

      playButton.disabled = true;


      playButton.onclick = () => {

        playMusic(file);

      };


      // Pause button
      const pauseButton = document.createElement("button");

      pauseButton.className = "music-button";

      pauseButton.textContent = "⏸";

      pauseButton.disabled = true;


      pauseButton.onclick = () => {

        pauseMusic();

      };


      // Repeat button
      const repeatButton = document.createElement("button");

      repeatButton.className = "music-button";

      repeatButton.textContent = "🔁";

      repeatButton.disabled = true;


      let repeating = false;


      repeatButton.onclick = () => {

        repeating = !repeating;

        repeatButton.classList.toggle(
          "repeat-active",
          repeating
        );


        toggleRepeat(
          file,
          repeating
        );

      };


      item.appendChild(nameElement);

      item.appendChild(playButton);

      item.appendChild(pauseButton);

      item.appendChild(repeatButton);


      musicContainer.appendChild(item);

    });

  </script>

</body>
</html>
