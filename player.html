<!DOCTYPE html>
<html>
<head>
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    #status {
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    #enableAudio {
      padding: 20px 30px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #enableAudio.enabled {
      background: #3a3;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Soundboard Player</h1>

  <p id="status">Connecting...</p>

  <button id="enableAudio">
    🔊 Enable Audio
  </button>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    const status = document.getElementById("status");
    const enableButton = document.getElementById("enableAudio");


    // --------------------------------------------------
    // AUDIO
    // --------------------------------------------------

    let audioEnabled = false;

    let musicAudio = null;

    let currentMusicFile = null;

    let repeatMusic = false;


    // Enable audio after user interaction
    enableButton.onclick = () => {

      audioEnabled = true;

      enableButton.textContent = "🔊 Audio Enabled";

      enableButton.classList.add("enabled");

      status.textContent =
        "🟢 Audio enabled — waiting for sounds";

    };


    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const keys = await fetch("keys.json").then(r => r.json());


    const supabase = createClient(
      keys.supabaseUrl,
      keys.supabaseKey
    );


    const channel = supabase.channel("soundboard");


    // --------------------------------------------------
    // SOUND EFFECTS
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "play-sound" },
      async (message) => {

        console.log("SOUND RECEIVED:", message);


        const file = message?.payload?.file;


        if (!file) {

          console.error(
            "No sound filename received."
          );

          return;

        }


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Sound received — click Enable Audio.";

          return;

        }


        console.log("Playing sound:", file);


        const audio = new Audio(
          "sounds/" + encodeURIComponent(file)
        );


        audio.play().catch(error => {

          console.error(
            "Sound playback failed:",
            error
          );

        });

      }
    );


    // --------------------------------------------------
    // MUSIC PLAY
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "play-music" },
      async (message) => {

        console.log("MUSIC PLAY:", message);


        const file = message?.payload?.file;


        if (!file) return;


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Music received — click Enable Audio.";

          return;

        }


        currentMusicFile = file;


        // Stop previous song
        if (musicAudio) {

          musicAudio.pause();

          musicAudio.currentTime = 0;

        }


        // Create new music player
        musicAudio = new Audio(
          "music/" + encodeURIComponent(file)
        );


        musicAudio.loop = repeatMusic;


        musicAudio.onended = () => {

          console.log("Music ended.");

          if (!repeatMusic) {

            status.textContent =
              "🟢 Music finished";

          }

        };


        status.textContent =
          "🎵 Playing: " + file;


        try {

          await musicAudio.play();

        } catch (error) {

          console.error(
            "Music playback failed:",
            error
          );

          status.textContent =
            "🔴 Music playback failed.";

        }

      }
    );


    // --------------------------------------------------
    // MUSIC PAUSE
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "pause-music" },
      () => {

        console.log("MUSIC PAUSE");


        if (musicAudio) {

          musicAudio.pause();

          status.textContent =
            "⏸ Music paused";

        }

      }
    );


    // --------------------------------------------------
    // MUSIC REPEAT
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "repeat-music" },
      (message) => {

        console.log("MUSIC REPEAT:", message);


        const file = message?.payload?.file;

        const repeat =
          message?.payload?.repeat;


        if (
          file &&
          currentMusicFile !== file
        ) {

          return;

        }


        repeatMusic = !!repeat;


        if (musicAudio) {

          musicAudio.loop = repeatMusic;

        }


        status.textContent =
          repeatMusic
            ? "🔁 Music repeating"
            : "🎵 Repeat off";

      }
    );


    // --------------------------------------------------
    // CONNECT
    // --------------------------------------------------

    channel.subscribe((state, error) => {

      console.log("STATE:", state);
      console.log("ERROR:", error);


      if (state === "SUBSCRIBED") {

        if (audioEnabled) {

          status.textContent =
            "🟢 Connected — waiting for sounds";

        } else {

          status.textContent =
            "🟢 Connected — click Enable Audio";

        }

      }


      if (state === "CHANNEL_ERROR") {

        status.textContent =
          "🔴 Realtime connection error";

        console.error(error);

      }


      if (state === "TIMED_OUT") {

        status.textContent =
          "🔴 Realtime connection timed out";

      }

    });

  </script>

</body>
</html>
