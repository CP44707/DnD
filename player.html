<!DOCTYPE html>
<html>
<head>
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    #status {
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    #enableAudio {
      padding: 20px 30px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 20px;
    }

    #enableAudio.enabled {
      background: #3a3;
      color: white;
    }
  </style>
</head>

<body>

  <h1>Soundboard Player</h1>

  <p id="status">Connecting...</p>

  <button id="enableAudio">
    🔊 Enable Audio
  </button>


  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // --------------------------------------------------
    // BASIC SETTINGS
    // --------------------------------------------------

    const status =
      document.getElementById("status");

    const enableButton =
      document.getElementById("enableAudio");


    // How long the end and beginning overlap.
    // 1.5 seconds is a good starting point.
    const CROSSFADE_TIME = 1.5;


    // --------------------------------------------------
    // AUDIO STATE
    // --------------------------------------------------

    let audioEnabled = false;

    let audioContext = null;


    // Sound effects
    let soundAudio = null;


    // Music
    let musicAudio = null;
    let musicGain = null;

    let nextMusicAudio = null;
    let nextMusicGain = null;

    let currentMusicFile = null;

    let repeatMusic = false;

    let crossfadeTimer = null;


    // --------------------------------------------------
    // ENABLE AUDIO
    // --------------------------------------------------

    enableButton.onclick = async () => {

      audioEnabled = true;


      // Create Web Audio context after
      // a real user interaction.
      if (!audioContext) {

        audioContext =
          new AudioContext();

      }


      if (audioContext.state === "suspended") {

        await audioContext.resume();

      }


      enableButton.textContent =
        "🔊 Audio Enabled";

      enableButton.classList.add(
        "enabled"
      );


      status.textContent =
        "🟢 Audio enabled — waiting for sounds";

    };


    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const keys =
      await fetch("keys.json")
        .then(r => r.json());


    const supabase =
      createClient(
        keys.supabaseUrl,
        keys.supabaseKey
      );


    // IMPORTANT:
    // This must match the host channel.
    const channel =
      supabase.channel("soundboard");


    // --------------------------------------------------
    // SOUND EFFECTS
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "play-sound" },
      async (message) => {

        console.log(
          "SOUND RECEIVED:",
          message
        );


        const file =
          message?.payload?.file;


        if (!file) {

          console.error(
            "No sound filename received."
          );

          return;

        }


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Sound received — click Enable Audio.";

          return;

        }


        console.log(
          "Playing sound:",
          file
        );


        soundAudio =
          new Audio(
            "sounds/" +
            encodeURIComponent(file)
          );


        soundAudio
          .play()
          .catch(error => {

            console.error(
              "Sound playback failed:",
              error
            );

            status.textContent =
              "🔴 Sound playback failed.";

          });

      }
    );


    // --------------------------------------------------
    // PLAY MUSIC
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "play-music" },
      async (message) => {

        console.log(
          "MUSIC PLAY:",
          message
        );


        const file =
          message?.payload?.file;


        if (!file) return;


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Music received — click Enable Audio.";

          return;

        }


        currentMusicFile = file;


        // Stop whatever music was playing.
        stopMusic();


        // Create the new music element.
        musicAudio =
          new Audio(
            "music/" +
            encodeURIComponent(file)
          );


        musicAudio.preload = "auto";


        // Create Web Audio gain node.
        musicGain =
          audioContext.createGain();


        // Connect HTML audio to Web Audio.
        const source =
          audioContext
            .createMediaElementSource(
              musicAudio
            );


        source.connect(musicGain);

        musicGain.connect(
          audioContext.destination
        );


        // Normal volume.
        musicGain.gain.value = 1;


        // If the song ends naturally and
        // repeat isn't enabled, we're done.
        musicAudio.onended = () => {

          if (!repeatMusic) {

            status.textContent =
              "🟢 Music finished";

          }

        };


        status.textContent =
          "🎵 Playing: " + file;


        try {

          await musicAudio.play();

          // Start checking for the crossfade point.
          startCrossfadeTimer();

        } catch (error) {

          console.error(
            "Music playback failed:",
            error
          );


          status.textContent =
            "🔴 Music playback failed.";

        }

      }
    );


    // --------------------------------------------------
    // PAUSE MUSIC
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "pause-music" },
      () => {

        console.log(
          "MUSIC PAUSE"
        );


        if (musicAudio) {

          musicAudio.pause();

          // Don't allow the crossfade timer
          // to start another copy while paused.
          stopCrossfadeTimer();


          status.textContent =
            "⏸ Music paused";

        }

      }
    );


    // --------------------------------------------------
    // REPEAT MUSIC
    // --------------------------------------------------

    channel.on(
      "broadcast",
      { event: "repeat-music" },
      (message) => {

        console.log(
          "MUSIC REPEAT:",
          message
        );


        const file =
          message?.payload?.file;

        const repeat =
          message?.payload?.repeat;


        // Ignore repeat commands for
        // a song that isn't currently playing.
        if (
          file &&
          currentMusicFile !== file
        ) {

          return;

        }


        repeatMusic =
          !!repeat;


        if (repeatMusic) {

          status.textContent =
            "🔁 Music repeating";


          // Begin monitoring the song.
          startCrossfadeTimer();

        } else {

          stopCrossfadeTimer();


          status.textContent =
            "🎵 Repeat off";

        }

      }
    );


    // --------------------------------------------------
    // START CROSSFADE TIMER
    // --------------------------------------------------

    function startCrossfadeTimer() {

      stopCrossfadeTimer();


      if (!musicAudio) return;

      if (!repeatMusic) return;


      crossfadeTimer =
        setInterval(() => {

          if (!musicAudio) return;

          if (!repeatMusic) return;


          // Don't do anything while paused.
          if (musicAudio.paused) return;


          const duration =
            musicAudio.duration;


          const currentTime =
            musicAudio.currentTime;


          if (!Number.isFinite(duration)) {
            return;
          }


          const remaining =
            duration - currentTime;


          // Start the next copy when
          // we're CROSSFADE_TIME from the end.
          if (
            remaining <= CROSSFADE_TIME &&
            remaining > 0
          ) {

            performCrossfade();

          }

        }, 50);

    }


    // --------------------------------------------------
    // STOP CROSSFADE TIMER
    // --------------------------------------------------

    function stopCrossfadeTimer() {

      if (crossfadeTimer) {

        clearInterval(
          crossfadeTimer
        );

        crossfadeTimer = null;

      }

    }


    // --------------------------------------------------
    // PERFORM CROSSFADE
    // --------------------------------------------------

    async function performCrossfade() {

      if (!musicAudio) return;

      if (!repeatMusic) return;


      // Prevent the timer from starting
      // multiple overlapping copies.
      if (nextMusicAudio) return;


      const file =
        currentMusicFile;


      console.log(
        "Starting crossfade:",
        file
      );


      // Create second copy of the song.
      nextMusicAudio =
        new Audio(
          "music/" +
          encodeURIComponent(file)
        );


      nextMusicAudio.preload =
        "auto";


      // Create gain node for second copy.
      nextMusicGain =
        audioContext.createGain();


      const nextSource =
        audioContext
          .createMediaElementSource(
            nextMusicAudio
          );


      nextSource.connect(
        nextMusicGain
      );


      nextMusicGain.connect(
        audioContext.destination
      );


      // Start the new song at zero volume.
      nextMusicGain.gain.value = 0;


      try {

        await nextMusicAudio.play();

      } catch (error) {

        console.error(
          "Crossfade playback failed:",
          error
        );


        nextMusicAudio = null;
        nextMusicGain = null;

        return;

      }


      const now =
        audioContext.currentTime;


      // ------------------------------
      // OLD SONG: FADE OUT
      // ------------------------------

      musicGain.gain.cancelScheduledValues(
        now
      );


      musicGain.gain.setValueAtTime(
        musicGain.gain.value,
        now
      );


      musicGain.gain.linearRampToValueAtTime(
        0,
        now + CROSSFADE_TIME
      );


      // ------------------------------
      // NEW SONG: FADE IN
      // ------------------------------

      nextMusicGain.gain.cancelScheduledValues(
        now
      );


      nextMusicGain.gain.setValueAtTime(
        0,
        now
      );


      nextMusicGain.gain.linearRampToValueAtTime(
        1,
        now + CROSSFADE_TIME
      );


      // After the crossfade, make the new
      // audio element the current one.
      setTimeout(() => {

        if (musicAudio) {

          musicAudio.pause();

          musicAudio.currentTime = 0;

        }


        musicAudio =
          nextMusicAudio;

        musicGain =
          nextMusicGain;


        nextMusicAudio = null;
        nextMusicGain = null;


        console.log(
          "Crossfade complete."
        );


        // Continue monitoring the new copy.
        startCrossfadeTimer();


      }, CROSSFADE_TIME * 1000);

    }


    // --------------------------------------------------
    // STOP ALL MUSIC
    // --------------------------------------------------

    function stopMusic() {

      stopCrossfadeTimer();


      if (musicAudio) {

        musicAudio.pause();

        musicAudio.currentTime = 0;

      }


      if (nextMusicAudio) {

        nextMusicAudio.pause();

        nextMusicAudio.currentTime = 0;

      }


      musicAudio = null;
      nextMusicAudio = null;


      musicGain = null;
      nextMusicGain = null;

    }


    // --------------------------------------------------
    // CONNECT TO REALTIME
    // --------------------------------------------------

    channel.subscribe(
      (state, error) => {

        console.log(
          "STATE:",
          state
        );

        console.log(
          "ERROR:",
          error
        );


        if (
          state === "SUBSCRIBED"
        ) {

          if (audioEnabled) {

            status.textContent =
              "🟢 Connected — waiting for sounds";

          } else {

            status.textContent =
              "🟢 Connected — click Enable Audio";

          }

        }


        if (
          state === "CHANNEL_ERROR"
        ) {

          status.textContent =
            "🔴 Realtime connection error";


          console.error(
            error
          );

        }


        if (
          state === "TIMED_OUT"
        ) {

          status.textContent =
            "🔴 Realtime connection timed out";

        }

      }
    );

  </script>

</body>
</html>
