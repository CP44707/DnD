<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      padding: 30px;
    }

    input, button {
      font: inherit;
      padding: 12px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
    }

    #player {
      display: none;
    }

    .box {
      background: #333;
      padding: 25px;
      border-radius: 10px;
      max-width: 500px;
    }

    #code {
      width: 100%;
      box-sizing: border-box;
      font-size: 24px;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    #status {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>🎧 Soundboard Player</h1>

<p id="status">
  Enter the host's session code.
</p>


<div id="join" class="box">

  <input
    id="code"
    maxlength="8"
    placeholder="ABCDEFGH"
  >

  <br>

  <button id="joinButton">
    Join Session
  </button>

  <p id="message"></p>

</div>


<div id="player" class="box">

  <h2>Connected</h2>

  <button id="enableAudio">
    🔊 Enable Audio
  </button>

  <button id="leave">
    Leave Session
  </button>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// --------------------------------------------------
// SUPABASE
// --------------------------------------------------

const keys =
  await fetch("keys.json").then(r => r.json());

const supabase =
  createClient(
    keys.supabaseUrl,
    keys.supabaseKey
  );


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const join =
  document.getElementById("join");

const player =
  document.getElementById("player");

const codeInput =
  document.getElementById("code");

const joinButton =
  document.getElementById("joinButton");

const enableAudio =
  document.getElementById("enableAudio");

const leaveButton =
  document.getElementById("leave");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


// --------------------------------------------------
// STATE
// --------------------------------------------------

let channel = null;

let audioEnabled = false;

let musicAudio = null;


// --------------------------------------------------
// ENABLE AUDIO
// --------------------------------------------------

enableAudio.onclick =
  () => {

    audioEnabled = true;

    enableAudio.textContent =
      "🔊 Audio Enabled";

    status.textContent =
      "🟢 Connected — waiting for sounds.";

  };


// --------------------------------------------------
// PLAY URL
// --------------------------------------------------

function playUrl(url) {

  if (!audioEnabled) {

    status.textContent =
      "⚠️ Sound received. Click Enable Audio.";

    return;

  }


  const audio =
    new Audio(url);


  audio.play()
    .catch(error => {

      console.error(
        "Audio playback failed:",
        error
      );

      status.textContent =
        "🔴 Audio playback failed.";

    });

}


// --------------------------------------------------
// JOIN
// --------------------------------------------------

joinButton.onclick =
  async () => {

    const code =
      codeInput.value
        .trim()
        .toUpperCase();


    if (code.length !== 8) {

      message.textContent =
        "Enter the 8-character code.";

      return;

    }


    joinButton.disabled =
      true;

    message.textContent =
      "Connecting...";


    if (channel) {

      await supabase.removeChannel(
        channel
      );

    }


    channel =
      supabase.channel(
        "soundboard-" + code
      );


    // SOUND

    channel.on(
      "broadcast",
      {
        event: "play-sound"
      },
      message => {

        const payload =
          message.payload;

        if (
          payload &&
          payload.url
        ) {

          status.textContent =
            "🔊 Playing: " +
            payload.file;

          playUrl(payload.url);

        }

      }
    );


    // MUSIC

    channel.on(
      "broadcast",
      {
        event: "play-music"
      },
      message => {

        const payload =
          message.payload;

        if (
          !payload ||
          !payload.url
        ) {

          return;

        }


        if (musicAudio) {

          musicAudio.pause();

        }


        musicAudio =
          new Audio(
            payload.url
          );


        status.textContent =
          "🎵 Playing: " +
          payload.file;


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Music received. Click Enable Audio.";

          return;

        }


        musicAudio.play()
          .catch(error => {

            console.error(error);

            status.textContent =
              "🔴 Music playback failed.";

          });

      }
    );


    // CONNECT

    channel.subscribe(
      state => {

        if (state === "SUBSCRIBED") {

          join.style.display =
            "none";

          player.style.display =
            "block";

          message.textContent =
            "";

          status.textContent =
            audioEnabled
              ? "🟢 Connected — waiting for sounds."
              : "🟢 Connected — click Enable Audio.";

        }


        if (
          state === "CHANNEL_ERROR" ||
          state === "TIMED_OUT"
        ) {

          joinButton.disabled =
            false;

          message.textContent =
            "Could not connect to that session.";

          status.textContent =
            "🔴 Connection failed.";

        }

      }
    );

  };


// --------------------------------------------------
// LEAVE
// --------------------------------------------------

leaveButton.onclick =
  async () => {

    if (musicAudio) {

      musicAudio.pause();

      musicAudio = null;

    }


    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel = null;

    }


    join.style.display =
      "block";

    player.style.display =
      "none";

    codeInput.value =
      "";

    joinButton.disabled =
      false;

    status.textContent =
      "Enter the host's session code.";

  };


// --------------------------------------------------
// ENTER KEY
// --------------------------------------------------

codeInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      joinButton.click();

    }

  }
);

</script>

</body>
</html>
