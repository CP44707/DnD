<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      padding: 30px;
    }

    input, button {
      font: inherit;
      padding: 12px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
    }

    #player {
      display: none;
    }

    .box {
      background: #333;
      padding: 25px;
      border-radius: 10px;
      max-width: 500px;
    }

    #code {
      width: 100%;
      box-sizing: border-box;
      font-size: 24px;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    #status {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>🎧 Soundboard Player</h1>

<p id="status">
  Enter the host's session code.
</p>


<div id="join" class="box">

  <input
    id="code"
    maxlength="8"
    placeholder="ABCDEFGH"
  >

  <br>

  <button id="joinButton">
    Join Session
  </button>

  <p id="message"></p>

</div>


<div id="player" class="box">

  <h2>Connected</h2>

  <button id="enableAudio">
    🔊 Enable Audio
  </button>

  <button id="leave">
    Leave Session
  </button>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// --------------------------------------------------
// SUPABASE
// --------------------------------------------------

const keys =
  await fetch("keys.json").then(r => r.json());

const supabase =
  createClient(
    keys.supabaseUrl,
    keys.supabaseKey
  );


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const join =
  document.getElementById("join");

const player =
  document.getElementById("player");

const codeInput =
  document.getElementById("code");

const joinButton =
  document.getElementById("joinButton");

const enableAudio =
  document.getElementById("enableAudio");

const leaveButton =
  document.getElementById("leave");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


// --------------------------------------------------
// STATE
// --------------------------------------------------

let channel = null;

let audioEnabled = false;

let musicAudio = null;

let currentMusicFile = null;

let currentMusicUrl = null;

let repeatMusic = false;


// Preloaded audio stored as local object URLs.
let preloadedAudio = new Map();


// --------------------------------------------------
// REPEAT SETTINGS
// --------------------------------------------------

// Start the next copy this many seconds
// before the current copy ends.
const REPEAT_OVERLAP = 0.25;


// Timer used to start the next copy.
let repeatTimer = null;


// Every time the active song changes,
// this number increases.
//
// This prevents an old repeat timer,
// metadata event, or fade operation from
// affecting a newer song.
let musicGeneration = 0;


// Keep track of active fade timers so they
// can be cancelled when music changes.
let fadeTimers = new Set();


// --------------------------------------------------
// ENABLE AUDIO
// --------------------------------------------------

enableAudio.onclick =
  async () => {

    audioEnabled = true;

    enableAudio.textContent =
      "🔊 Audio Enabled";

    status.textContent =
      "🟢 Connected — waiting for sounds.";

    // If music was received while audio
    // was disabled, try starting it now.
    if (
      musicAudio &&
      musicAudio.paused
    ) {

      try {

        await musicAudio.play();

        scheduleRepeat();

      } catch (error) {

        console.error(
          "Audio enable playback failed:",
          error
        );

        status.textContent =
          "🔴 Audio playback failed.";

      }

    }

  };


// --------------------------------------------------
// PLAY URL
// --------------------------------------------------

function playUrl(
  url,
  file = null
) {

  if (!audioEnabled) {

    status.textContent =
      "⚠️ Sound received. Click Enable Audio.";

    return;

  }


  const audio =
    new Audio(
      file && preloadedAudio.has(file)
        ? preloadedAudio.get(file)
        : url
    );


  audio.play()
    .catch(error => {

      console.error(
        "Audio playback failed:",
        error
      );

      status.textContent =
        "🔴 Audio playback failed.";

    });

}


// --------------------------------------------------
// PRELOAD ALL AUDIO
// --------------------------------------------------

async function preloadAllAudio() {

  console.log(
    "PRELOAD AUDIO RECEIVED"
  );


  status.textContent =
    "⚡ Preloading audio...";


  try {

    const [
      soundsResponse,
      musicResponse
    ] =
    await Promise.all([

      fetch("sounds.json"),

      fetch("music.json")

    ]);


    if (
      !soundsResponse.ok ||
      !musicResponse.ok
    ) {

      throw new Error(
        "Could not load audio file lists."
      );

    }


    const sounds =
      await soundsResponse.json();

    const music =
      await musicResponse.json();


    const files = [

      ...sounds.map(
        file => ({
          file: file,
          path: "sounds/"
        })
      ),

      ...music.map(
        file => ({
          file: file,
          path: "music/"
        })
      )

    ];


    let loaded =
      0;


    await Promise.all(

      files.map(
        async item => {

          const url =
            item.path +
            encodeURIComponent(
              item.file
            );


          const response =
            await fetch(url);


          if (!response.ok) {

            throw new Error(
              "Failed to preload " +
              item.file
            );

          }


          const blob =
            await response.blob();


          const objectUrl =
            URL.createObjectURL(
              blob
            );


          // Replace an existing preload
          // if one already exists.
          if (
            preloadedAudio.has(
              item.file
            )
          ) {

            URL.revokeObjectURL(
              preloadedAudio.get(
                item.file
              )
            );

          }


          preloadedAudio.set(
            item.file,
            objectUrl
          );


          loaded++;


          status.textContent =
            "⚡ Preloading audio... " +
            loaded +
            "/" +
            files.length;

        }
      )

    );


    status.textContent =
      "🟢 Audio preloaded — ready.";


    console.log(
      "Audio preload complete:",
      preloadedAudio.size,
      "files"
    );


  } catch (error) {

    console.error(
      "Audio preload failed:",
      error
    );


    status.textContent =
      "🔴 Audio preload failed.";

  }

}


// --------------------------------------------------
// CLEAR REPEAT TIMER
// --------------------------------------------------

function clearRepeatTimer() {

  if (repeatTimer !== null) {

    clearTimeout(
      repeatTimer
    );

    repeatTimer =
      null;

  }

}


// --------------------------------------------------
// CLEAR FADE TIMERS
// --------------------------------------------------

function clearFadeTimers() {

  for (
    const timer
    of fadeTimers
  ) {

    clearInterval(timer);

  }

  fadeTimers.clear();

}


// --------------------------------------------------
// SCHEDULE REPEAT
// --------------------------------------------------

function scheduleRepeat() {

  clearRepeatTimer();


  if (!musicAudio) {

    return;

  }


  if (!repeatMusic) {

    return;

  }


  const generation =
    musicGeneration;


  // If metadata isn't available yet,
  // wait for it.
  if (
    !Number.isFinite(
      musicAudio.duration
    ) ||
    musicAudio.duration <= 0
  ) {

    musicAudio.addEventListener(
      "loadedmetadata",
      () => {

        // Make sure this is still the
        // currently active music player.
        if (
          generation !==
          musicGeneration
        ) {

          return;

        }


        scheduleRepeat();

      },
      {
        once: true
      }
    );


    return;

  }


  const remaining =
    musicAudio.duration -
    musicAudio.currentTime;


  // We want the new copy to begin
  // REPEAT_OVERLAP seconds before the end.
  const timeUntilOverlap =
    remaining -
    REPEAT_OVERLAP;


  const delay =
    Math.max(
      0,
      timeUntilOverlap * 1000
    );


  console.log(
    "Repeat scheduled in:",
    delay,
    "ms"
  );


  repeatTimer =
    setTimeout(
      () => {

        repeatTimer =
          null;


        // Ignore an old timer if a new
        // song has been selected.
        if (
          generation !==
          musicGeneration
        ) {

          return;

        }


        repeatSong(
          generation
        );

      },
      delay
    );

}


// --------------------------------------------------
// REPEAT SONG
// --------------------------------------------------

function repeatSong(
  generation
) {

  if (!musicAudio) {

    return;

  }


  if (!repeatMusic) {

    return;

  }


  if (!currentMusicFile) {

    return;

  }


  // Do not allow an old repeat operation
  // to touch a newer song.
  if (
    generation !==
    musicGeneration
  ) {

    return;

  }


  const oldAudio =
    musicAudio;


  const file =
    currentMusicFile;


  const url =
    currentMusicUrl;


  const audioSource =
    preloadedAudio.has(file)

      ? preloadedAudio.get(file)

      : url;


  console.log(
    "REPEATING SONG:",
    file
  );


  // ------------------------------------------------
  // CREATE NEW COPY
  // ------------------------------------------------

  const newAudio =
    new Audio(
      audioSource
    );


  newAudio.volume =
    1;


  newAudio.loop =
    false;


  // ------------------------------------------------
  // MAKE NEW COPY CURRENT
  // ------------------------------------------------

  musicAudio =
    newAudio;


  // ------------------------------------------------
  // START NEW COPY
  // ------------------------------------------------

  if (audioEnabled) {

    newAudio.play()
      .catch(error => {

        console.error(
          "Repeat playback failed:",
          error
        );

        // If this particular copy failed,
        // do not leave a stale repeat timer.
        if (
          musicAudio === newAudio
        ) {

          clearRepeatTimer();

        }

      });

  }


  // ------------------------------------------------
  // FADE OLD COPY
  // ------------------------------------------------

  const fadeSteps =
    10;


  let step =
    0;


  const fadeTimer =
    setInterval(
      () => {

        // If the old audio is no longer
        // relevant, stop the fade.
        if (
          oldAudio !== musicAudio &&
          generation !== musicGeneration
        ) {

          clearInterval(
            fadeTimer
          );

          fadeTimers.delete(
            fadeTimer
          );

          return;

        }


        step++;


        oldAudio.volume =
          Math.max(
            0,
            1 -
              (
                step /
                fadeSteps
              )
          );


        if (
          step >= fadeSteps
        ) {

          clearInterval(
            fadeTimer
          );

          fadeTimers.delete(
            fadeTimer
          );


          oldAudio.pause();


          try {

            oldAudio.currentTime =
              0;

          } catch (error) {

            console.warn(
              "Could not reset old audio:",
              error
            );

          }


          oldAudio.volume =
            1;

        }

      },
      (
        REPEAT_OVERLAP *
        1000
      ) /
      fadeSteps
    );


  fadeTimers.add(
    fadeTimer
  );


  // ------------------------------------------------
  // SCHEDULE NEXT REPEAT
  // ------------------------------------------------

  newAudio.addEventListener(
    "loadedmetadata",
    () => {

      if (
        musicAudio !== newAudio
      ) {

        return;

      }


      if (
        generation !==
        musicGeneration
      ) {

        return;

      }


      scheduleRepeat();

    },
    {
      once: true
    }
  );


  // In case metadata is already available.
  if (
    Number.isFinite(
      newAudio.duration
    ) &&
    newAudio.duration > 0
  ) {

    scheduleRepeat();

  }

}


// --------------------------------------------------
// STOP MUSIC
// --------------------------------------------------

function stopMusic() {

  clearRepeatTimer();

  clearFadeTimers();


  if (musicAudio) {

    musicAudio.pause();


    try {

      musicAudio.currentTime =
        0;

    } catch (error) {

      console.warn(
        "Could not reset music:",
        error
      );

    }


    musicAudio.volume =
      1;

  }


  musicAudio =
    null;

}


// --------------------------------------------------
// START NEW MUSIC
// --------------------------------------------------

async function startMusic(
  file,
  url
) {

  // Invalidate every old repeat operation.
  musicGeneration++;


  const generation =
    musicGeneration;


  // Stop the previous song completely.
  stopMusic();


  currentMusicFile =
    file;

  currentMusicUrl =
    url;


  const audioSource =
    preloadedAudio.has(file)

      ? preloadedAudio.get(file)

      : url;


  const audio =
    new Audio(
      audioSource
    );


  audio.loop =
    false;


  audio.volume =
    1;


  musicAudio =
    audio;


  audio.onended =
    () => {

      // Ignore an ended event from an
      // older audio instance.
      if (
        musicAudio !== audio
      ) {

        return;

      }


      console.log(
        "Music ended."
      );


      // With repeat enabled, repeatSong()
      // should normally have replaced this
      // audio before the natural end.
      if (!repeatMusic) {

        status.textContent =
          "🟢 Music finished";

      }

    };


  // ------------------------------------------------
  // PLAY
  // ------------------------------------------------

  if (!audioEnabled) {

    status.textContent =
      "⚠️ Music received. Click Enable Audio.";

    return;

  }


  try {

    await audio.play();


    // Make sure this is still the current
    // song after play() resolves.
    if (
      generation !==
      musicGeneration
    ) {

      return;

    }


    scheduleRepeat();

  } catch (error) {

    console.error(
      "Music playback failed:",
      error
    );


    status.textContent =
      "🔴 Music playback failed.";

  }

}


// --------------------------------------------------
// JOIN
// --------------------------------------------------

joinButton.onclick =
  async () => {

    const code =
      codeInput.value
        .trim()
        .toUpperCase();


    if (code.length !== 8) {

      message.textContent =
        "Enter the 8-character code.";

      return;

    }


    joinButton.disabled =
      true;

    message.textContent =
      "Connecting...";


    // Stop any old local music.
    musicGeneration++;

    stopMusic();


    currentMusicFile =
      null;

    currentMusicUrl =
      null;

    repeatMusic =
      false;


    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel =
        null;

    }


    channel =
      supabase.channel(
        "soundboard-" + code
      );


    // ------------------------------------------------
    // PRELOAD AUDIO
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "preload-audio"
      },
      () => {

        preloadAllAudio();

      }
    );


    // ------------------------------------------------
    // SOUND
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "play-sound"
      },
      message => {

        const payload =
          message.payload;


        if (
          payload &&
          payload.url
        ) {

          status.textContent =
            "🔊 Playing: " +
            payload.file;


          playUrl(
            payload.url,
            payload.file
          );

        }

      }
    );


    // ------------------------------------------------
    // MUSIC
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "play-music"
      },
      async message => {

        const payload =
          message.payload;


        if (
          !payload ||
          !payload.url ||
          !payload.file
        ) {

          console.warn(
            "Invalid play-music payload:",
            payload
          );

          return;

        }


        console.log(
          "MUSIC PLAY:",
          payload
        );


        // A new song always starts with
        // repeat disabled.
        repeatMusic =
          false;


        status.textContent =
          "🎵 Playing: " +
          payload.file;


        await startMusic(
          payload.file,
          payload.url
        );

      }
    );


    // ------------------------------------------------
    // MUSIC PAUSE
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "pause-music"
      },
      () => {

        console.log(
          "MUSIC PAUSE"
        );


        clearRepeatTimer();


        if (musicAudio) {

          musicAudio.pause();

        }


        status.textContent =
          "⏸ Music paused";

      }
    );


    // ------------------------------------------------
    // MUSIC STOP
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "stop-music"
      },
      message => {

        const file =
          message?.payload?.file;


        if (
          file &&
          currentMusicFile !== file
        ) {

          return;

        }


        console.log(
          "MUSIC STOP"
        );


        musicGeneration++;
        stopMusic();

        currentMusicFile =
          null;

        currentMusicUrl =
          null;

        repeatMusic =
          false;

        status.textContent =
          "⏹ Music stopped";

      }
    );


    // ------------------------------------------------
    // MUSIC REPEAT
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "repeat-music"
      },
      message => {

        console.log(
          "MUSIC REPEAT:",
          message
        );


        const file =
          message?.payload?.file;


        const repeat =
          message?.payload?.repeat;


        // If the host specifies a file,
        // only change repeat for that song.
        if (
          file &&
          currentMusicFile !== file
        ) {

          console.log(
            "Ignoring repeat command for:",
            file,
            "Current song:",
            currentMusicFile
          );

          return;

        }


        repeatMusic =
          !!repeat;


        // ------------------------------------------------
        // ENABLE REPEAT
        // ------------------------------------------------

        if (repeatMusic) {

          console.log(
            "Repeat ENABLED for:",
            currentMusicFile
          );


          if (musicAudio) {

            scheduleRepeat();

          }


          status.textContent =
            "🔁 Music repeating";

        }


        // ------------------------------------------------
        // DISABLE REPEAT
        // ------------------------------------------------

        else {

          console.log(
            "Repeat DISABLED"
          );


          clearRepeatTimer();


          status.textContent =
            "🎵 Repeat off";

        }

      }
    );


    // ------------------------------------------------
    // CONNECT
    // ------------------------------------------------

    channel.subscribe(
      state => {

        console.log(
          "CHANNEL STATE:",
          state
        );


        if (
          state === "SUBSCRIBED"
        ) {

          join.style.display =
            "none";

          player.style.display =
            "block";

          message.textContent =
            "";


          status.textContent =
            audioEnabled

              ? "🟢 Connected — waiting for sounds."

              : "🟢 Connected — click Enable Audio.";

        }


        if (
          state === "CHANNEL_ERROR" ||
          state === "TIMED_OUT"
        ) {

          joinButton.disabled =
            false;


          message.textContent =
            "Could not connect to that session.";


          status.textContent =
            "🔴 Connection failed.";

        }

      }
    );

  };


// --------------------------------------------------
// LEAVE
// --------------------------------------------------

leaveButton.onclick =
  async () => {

    // Invalidate all pending repeat work.
    musicGeneration++;


    stopMusic();


    currentMusicFile =
      null;


    currentMusicUrl =
      null;


    repeatMusic =
      false;


    // Release preloaded audio URLs.
    for (
      const objectUrl
      of preloadedAudio.values()
    ) {

      URL.revokeObjectURL(
        objectUrl
      );

    }


    preloadedAudio.clear();


    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel =
        null;

    }


    join.style.display =
      "block";

    player.style.display =
      "none";


    codeInput.value =
      "";


    joinButton.disabled =
      false;


    status.textContent =
      "Enter the host's session code.";

  };


// --------------------------------------------------
// ENTER KEY
// --------------------------------------------------

codeInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      joinButton.click();

    }

  }
);

</script>

</body>
</html>
