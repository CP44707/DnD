<!DOCTYPE html>
<html>
<head>
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 30px;
      background: #222;
      color: white;
    }

    input {
      box-sizing: border-box;
    }

    #status {
      white-space: pre-wrap;
      margin-bottom: 20px;
    }

    #joinPanel {
      max-width: 450px;
      background: #2d2d2d;
      padding: 25px;
      border-radius: 10px;
    }

    #sessionCode {
      width: 100%;
      padding: 15px;
      font-size: 24px;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    #joinButton,
    #enableAudio,
    #leaveButton {
      padding: 20px 30px;
      font-size: 18px;
      cursor: pointer;
      margin-bottom: 10px;
    }

    #enableAudio.enabled {
      background: #3a3;
      color: white;
    }

    #playerPanel {
      display: none;
    }
  </style>
</head>

<body>

  <h1>🎧 Soundboard Player</h1>

  <p id="status">
    Enter the host's session code.
  </p>


  <!-- JOIN -->

  <div id="joinPanel">

    <h2>Join Session</h2>

    <input
      id="sessionCode"
      maxlength="8"
      placeholder="ABCDEFGH"
      autocomplete="off"
    >

    <br>

    <button id="joinButton">
      Join
    </button>

    <p id="joinMessage"></p>

  </div>


  <!-- PLAYER -->

  <div id="playerPanel">

    <button id="enableAudio">
      🔊 Enable Audio
    </button>

    <button id="leaveButton">
      Leave Session
    </button>

  </div>


  <script type="module">

    import {
      createClient
    } from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


    // --------------------------------------------------
    // SUPABASE
    // --------------------------------------------------

    const keys =
      await fetch("keys.json")
        .then(r => r.json());


    const supabase =
      createClient(
        keys.supabaseUrl,
        keys.supabaseKey
      );


    // --------------------------------------------------
    // ELEMENTS
    // --------------------------------------------------

    const status =
      document.getElementById("status");

    const joinPanel =
      document.getElementById("joinPanel");

    const playerPanel =
      document.getElementById("playerPanel");

    const joinButton =
      document.getElementById("joinButton");

    const joinMessage =
      document.getElementById("joinMessage");

    const sessionCodeInput =
      document.getElementById("sessionCode");

    const enableButton =
      document.getElementById("enableAudio");

    const leaveButton =
      document.getElementById("leaveButton");


    // --------------------------------------------------
    // STATE
    // --------------------------------------------------

    let channel = null;

    let connected = false;

    let audioEnabled = false;

    let musicAudio = null;

    let currentMusicFile = null;

    let repeatMusic = false;

    const REPEAT_OVERLAP = 0.25;

    let repeatTimer = null;


    // --------------------------------------------------
    // ENABLE AUDIO
    // --------------------------------------------------

    enableButton.onclick =
      () => {

        audioEnabled = true;


        enableButton.textContent =
          "🔊 Audio Enabled";


        enableButton.classList.add(
          "enabled"
        );


        status.textContent =
          connected
            ? "🟢 Connected — waiting for sounds"
            : "🟡 Audio enabled";

      };


    // --------------------------------------------------
    // JOIN
    // --------------------------------------------------

    joinButton.onclick =
      async () => {

        const code =
          sessionCodeInput
            .value
            .trim()
            .toUpperCase();


        if (code.length !== 8) {

          joinMessage.textContent =
            "Enter the 8-character session code.";

          return;

        }


        joinButton.disabled =
          true;


        joinMessage.textContent =
          "Connecting...";


        if (channel) {

          await supabase
            .removeChannel(channel);

          channel = null;

        }


        connected = false;


        channel =
          supabase.channel(
            "soundboard-" + code
          );


        // --------------------------------------------------
        // SOUND EFFECTS
        // --------------------------------------------------

        channel.on(
          "broadcast",
          {
            event: "play-sound"
          },
          message => {

            console.log(
              "SOUND:",
              message
            );


            const payload =
              message?.payload;


            if (!payload) return;


            if (!audioEnabled) {

              status.textContent =
                "⚠️ Sound received — click Enable Audio.";

              return;

            }


            if (
              payload.source ===
              "github"
            ) {

              playSound(
                payload.file
              );

            }

          }
        );


        // --------------------------------------------------
        // MUSIC PLAY
        // --------------------------------------------------

        channel.on(
          "broadcast",
          {
            event: "play-music"
          },
          async message => {

            console.log(
              "MUSIC:",
              message
            );


            const payload =
              message?.payload;


            if (!payload) return;


            if (!audioEnabled) {

              status.textContent =
                "⚠️ Music received — click Enable Audio.";

              return;

            }


            if (
              payload.source !==
              "github"
            ) {

              return;

            }


            currentMusicFile =
              payload.file;


            stopMusic();


            musicAudio =
              new Audio(
                "music/" +
                encodeURIComponent(
                  payload.file
                )
              );


            musicAudio.loop =
              false;


            musicAudio.onended =
              () => {

                if (!repeatMusic) {

                  status.textContent =
                    "🟢 Music finished";

                }

              };


            status.textContent =
              "🎵 Playing: " +
              payload.file;


            try {

              await musicAudio.play();

              scheduleRepeat();

            } catch (error) {

              console.error(
                "Music playback failed:",
                error
              );


              status.textContent =
                "🔴 Music playback failed.";

            }

          }
        );


        // --------------------------------------------------
        // PAUSE MUSIC
        // --------------------------------------------------

        channel.on(
          "broadcast",
          {
            event: "pause-music"
          },
          () => {

            if (!musicAudio)
              return;


            musicAudio.pause();


            clearTimeout(
              repeatTimer
            );


            repeatTimer = null;


            status.textContent =
              "⏸ Music paused";

          }
        );


        // --------------------------------------------------
        // REPEAT MUSIC
        // --------------------------------------------------

        channel.on(
          "broadcast",
          {
            event: "repeat-music"
          },
          message => {

            const payload =
              message?.payload;


            if (!payload) return;


            repeatMusic =
              !!payload.repeat;


            if (repeatMusic) {

              scheduleRepeat();

            } else {

              clearTimeout(
                repeatTimer
              );

              repeatTimer = null;

            }


            status.textContent =
              repeatMusic
                ? "🔁 Music repeating"
                : "🎵 Repeat off";

          }
        );


        // --------------------------------------------------
        // SUBSCRIBE
        // --------------------------------------------------

        channel.subscribe(
          (state, error) => {

            console.log(
              "PLAYER:",
              state,
              error
            );


            if (
              state === "SUBSCRIBED"
            ) {

              connected = true;


              joinPanel.style.display =
                "none";


              playerPanel.style.display =
                "block";


              joinMessage.textContent =
                "";


              status.textContent =
                audioEnabled
                  ? "🟢 Connected — waiting for sounds"
                  : "🟢 Connected — click Enable Audio";

            }


            if (
              state === "CHANNEL_ERROR"
            ) {

              connected = false;


              status.textContent =
                "🔴 Realtime connection error.";


              joinMessage.textContent =
                "Could not connect to that session.";


              joinButton.disabled =
                false;


              console.error(error);

            }


            if (
              state === "TIMED_OUT"
            ) {

              connected = false;


              status.textContent =
                "🔴 Connection timed out.";


              joinButton.disabled =
                false;

            }

          }
        );

      };


    // --------------------------------------------------
    // PLAY SOUND
    // --------------------------------------------------

    function playSound(file) {

      const audio =
        new Audio(
          "sounds/" +
          encodeURIComponent(file)
        );


      audio.play()
        .catch(error => {

          console.error(
            "Sound playback failed:",
            error
          );

        });

    }


    // --------------------------------------------------
    // SCHEDULE REPEAT
    // --------------------------------------------------

    function scheduleRepeat() {

      clearTimeout(
        repeatTimer
      );


      if (!musicAudio)
        return;


      if (!repeatMusic)
        return;


      const remaining =
        musicAudio.duration -
        musicAudio.currentTime -
        REPEAT_OVERLAP;


      if (
        !Number.isFinite(
          remaining
        ) ||
        remaining <= 0
      ) {

        return;

      }


      repeatTimer =
        setTimeout(
          repeatSong,
          remaining * 1000
        );

    }


    // --------------------------------------------------
    // REPEAT SONG
    // --------------------------------------------------

    function repeatSong() {

      if (!musicAudio)
        return;


      if (!repeatMusic)
        return;


      const oldAudio =
        musicAudio;


      const file =
        currentMusicFile;


      const newAudio =
        new Audio(
          "music/" +
          encodeURIComponent(file)
        );


      newAudio.volume = 1;


      newAudio.play()
        .catch(error => {

          console.error(
            "Repeat playback failed:",
            error
          );

        });


      const fadeSteps = 10;

      let step = 0;


      const fadeTimer =
        setInterval(
          () => {

            step++;


            oldAudio.volume =
              Math.max(
                0,
                1 -
                step / fadeSteps
              );


            if (
              step >= fadeSteps
            ) {

              clearInterval(
                fadeTimer
              );


              oldAudio.pause();

              oldAudio.currentTime =
                0;

              oldAudio.volume =
                1;

            }

          },
          (REPEAT_OVERLAP * 1000) /
          fadeSteps
        );


      musicAudio =
        newAudio;


      newAudio.addEventListener(
        "loadedmetadata",
        scheduleRepeat,
        {
          once: true
        }
      );

    }


    // --------------------------------------------------
    // STOP MUSIC
    // --------------------------------------------------

    function stopMusic() {

      clearTimeout(
        repeatTimer
      );


      repeatTimer = null;


      if (musicAudio) {

        musicAudio.pause();

        musicAudio.currentTime =
          0;

      }


      musicAudio = null;

    }


    // --------------------------------------------------
    // LEAVE
    // --------------------------------------------------

    leaveButton.onclick =
      async () => {

        stopMusic();


        if (channel) {

          await supabase
            .removeChannel(channel);

          channel = null;

        }


        connected = false;


        playerPanel.style.display =
          "none";


        joinPanel.style.display =
          "block";


        sessionCodeInput.value =
          "";


        joinMessage.textContent =
          "";


        status.textContent =
          "Enter the host's session code.";

      };


    // --------------------------------------------------
    // ENTER KEY
    // --------------------------------------------------

    sessionCodeInput
      .addEventListener(
        "keydown",
        event => {

          if (
            event.key === "Enter"
          ) {

            joinButton.click();

          }

        }
      );

  </script>

</body>
</html>
