<!DOCTYPE html>
<html>
<head>
  <title>Realtime Test</title>
</head>

<body>

  <h1>Supabase Realtime Test</h1>

  <pre id="status">Starting...</pre>

  <script type="module">

    import { createClient }
      from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

    const status = document.getElementById("status");

    try {

      const keys = await fetch("keys.json").then(r => r.json());

      status.textContent = "Keys loaded.\nConnecting...";

      const supabase = createClient(
        keys.supabaseUrl,
        keys.supabaseKey
      );

      const channel = supabase.channel("soundboard-test");

      channel.subscribe((state, error) => {

        console.log("Realtime state:", state);
        console.log("Realtime error:", error);

        status.textContent =
          "Realtime state: " + state +
          "\n\n" +
          (error ? JSON.stringify(error, null, 2) : "");

      });

    } catch (error) {

      status.textContent =
        "ERROR:\n" + error.message;

      console.error(error);

    }

  </script>

</body>
</html>
