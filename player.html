<!DOCTYPE html>
<html>
<head>
  <title>Realtime Test</title>
</head>

<body>

  <h1>Supabase Realtime Test</h1>

  <pre id="status">Starting...</pre>

<script type="module">

  import { createClient }
    from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";

  const status = document.getElementById("status");

  try {

    status.textContent = "Loading keys...";

    const keys = await fetch("keys.json").then(r => r.json());

    console.log("Supabase URL:", keys.supabaseUrl);
    console.log("Key loaded:", !!keys.supabaseKey);

    status.textContent = "Creating Supabase client...";

    const supabase = createClient(
      keys.supabaseUrl,
      keys.supabaseKey
    );

    status.textContent = "Connecting to Supabase...";

    const channel = supabase.channel("soundboard");

    channel.subscribe((state, error) => {

      console.log("STATE:", state);
      console.log("ERROR:", error);

      status.textContent =
        "STATE: " + state +
        "\n\nERROR: " +
        (error ? JSON.stringify(error, Object.getOwnPropertyNames(error), 2) : "none");

    });

  } catch (error) {

    console.error(error);

    status.textContent =
      "FAILED:\n\n" +
      JSON.stringify(error, Object.getOwnPropertyNames(error), 2);

  }

</script>

</body>
</html>
