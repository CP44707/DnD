<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Soundboard Player</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #222;
      color: white;
      padding: 30px;
    }

    input, button {
      font: inherit;
      padding: 12px;
      margin: 5px 0;
    }

    button {
      cursor: pointer;
    }

    #player {
      display: none;
    }

    .box {
      background: #333;
      padding: 25px;
      border-radius: 10px;
      max-width: 500px;
    }

    #code {
      width: 100%;
      box-sizing: border-box;
      font-size: 24px;
      text-align: center;
      letter-spacing: 5px;
      text-transform: uppercase;
    }

    #status {
      white-space: pre-wrap;
    }
  </style>
</head>

<body>

<h1>🎧 Soundboard Player</h1>

<p id="status">
  Enter the host's session code.
</p>


<div id="join" class="box">

  <input
    id="code"
    maxlength="8"
    placeholder="ABCDEFGH"
  >

  <br>

  <button id="joinButton">
    Join Session
  </button>

  <p id="message"></p>

</div>


<div id="player" class="box">

  <h2>Connected</h2>

  <button id="enableAudio">
    🔊 Enable Audio
  </button>

  <button id="leave">
    Leave Session
  </button>

</div>


<script type="module">

import {
  createClient
} from "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm";


// --------------------------------------------------
// SUPABASE
// --------------------------------------------------

const keys =
  await fetch("keys.json").then(r => r.json());

const supabase =
  createClient(
    keys.supabaseUrl,
    keys.supabaseKey
  );


// --------------------------------------------------
// ELEMENTS
// --------------------------------------------------

const join =
  document.getElementById("join");

const player =
  document.getElementById("player");

const codeInput =
  document.getElementById("code");

const joinButton =
  document.getElementById("joinButton");

const enableAudio =
  document.getElementById("enableAudio");

const leaveButton =
  document.getElementById("leave");

const status =
  document.getElementById("status");

const message =
  document.getElementById("message");


// --------------------------------------------------
// STATE
// --------------------------------------------------

let channel = null;

let audioEnabled = false;

let musicAudio = null;

let currentMusicFile = null;

let currentMusicUrl = null;

let repeatMusic = false;

// Preloaded audio stored as local object URLs.
let preloadedAudio = new Map();

// Start the next copy this many seconds early.
const REPEAT_OVERLAP = 0.25;

let repeatTimer = null;


// --------------------------------------------------
// ENABLE AUDIO
// --------------------------------------------------

enableAudio.onclick =
  () => {

    audioEnabled = true;

    enableAudio.textContent =
      "🔊 Audio Enabled";

    status.textContent =
      "🟢 Connected — waiting for sounds.";

  };


// --------------------------------------------------
// PLAY URL
// --------------------------------------------------

function playUrl(
  url,
  file = null
) {

  if (!audioEnabled) {

    status.textContent =
      "⚠️ Sound received. Click Enable Audio.";

    return;

  }


  const audio =
    new Audio(
      file && preloadedAudio.has(file)
        ? preloadedAudio.get(file)
        : url
    );


  audio.play()
    .catch(error => {

      console.error(
        "Audio playback failed:",
        error
      );

      status.textContent =
        "🔴 Audio playback failed.";

    });

}


// --------------------------------------------------
// PRELOAD ALL AUDIO
// --------------------------------------------------

async function preloadAllAudio() {

  console.log(
    "PRELOAD AUDIO RECEIVED"
  );


  status.textContent =
    "⚡ Preloading audio...";


  try {

    const [
      soundsResponse,
      musicResponse
    ] =
      await Promise.all([

        fetch("sounds.json"),

        fetch("music.json")

      ]);


    if (
      !soundsResponse.ok ||
      !musicResponse.ok
    ) {

      throw new Error(
        "Could not load audio file lists."
      );

    }


    const sounds =
      await soundsResponse.json();

    const music =
      await musicResponse.json();


    const files = [

      ...sounds.map(
        file => ({
          file: file,
          path: "sounds/"
        })
      ),

      ...music.map(
        file => ({
          file: file,
          path: "music/"
        })
      )

    ];


    let loaded =
      0;


    await Promise.all(

      files.map(
        async item => {

          const url =
            item.path +
            encodeURIComponent(
              item.file
            );


          const response =
            await fetch(url);


          if (!response.ok) {

            throw new Error(
              "Failed to preload " +
              item.file
            );

          }


          const blob =
            await response.blob();


          const objectUrl =
            URL.createObjectURL(
              blob
            );


          // Replace an existing preload
          // if one already exists.
          if (
            preloadedAudio.has(
              item.file
            )
          ) {

            URL.revokeObjectURL(
              preloadedAudio.get(
                item.file
              )
            );

          }


          preloadedAudio.set(
            item.file,
            objectUrl
          );


          loaded++;


          status.textContent =
            "⚡ Preloading audio... " +
            loaded +
            "/" +
            files.length;

        }
      )

    );


    status.textContent =
      "🟢 Audio preloaded — ready.";

    console.log(
      "Audio preload complete:",
      preloadedAudio.size,
      "files"
    );


  } catch (error) {

    console.error(
      "Audio preload failed:",
      error
    );


    status.textContent =
      "🔴 Audio preload failed.";

  }

}


// --------------------------------------------------
// SCHEDULE REPEAT
// --------------------------------------------------

function scheduleRepeat() {

  clearTimeout(
    repeatTimer
  );


  if (!musicAudio) return;

  if (!repeatMusic) return;


  if (
    !Number.isFinite(
      musicAudio.duration
    )
  ) {

    musicAudio.addEventListener(
      "loadedmetadata",
      () => {

        scheduleRepeat();

      },
      {
        once: true
      }
    );


    return;

  }


  // Wait until we are 0.25 seconds
  // from the end of the song.
  const remaining =
    musicAudio.duration -
    musicAudio.currentTime -
    REPEAT_OVERLAP;


  const delay =
    Math.max(
      0,
      remaining * 1000
    );


  repeatTimer =
    setTimeout(
      () => {

        repeatSong();

      },
      delay
    );

}


// --------------------------------------------------
// REPEAT SONG
// --------------------------------------------------

function repeatSong() {

  if (!musicAudio) return;

  if (!repeatMusic) return;

  if (!currentMusicFile) return;


  const oldAudio =
    musicAudio;


  const newAudio =
    new Audio(

      preloadedAudio.has(
        currentMusicFile
      )

        ? preloadedAudio.get(
            currentMusicFile
          )

        : currentMusicUrl

    );


  newAudio.volume =
    1;


  newAudio.play()
    .catch(error => {

      console.error(
        "Repeat playback failed:",
        error
      );

    });


  // Fade the old copy out during
  // the 0.25 second overlap.
  const fadeSteps =
    10;

  let step =
    0;


  const fadeTimer =
    setInterval(
      () => {

        step++;


        oldAudio.volume =
          Math.max(
            0,
            1 -
              (step / fadeSteps)
          );


        if (
          step >= fadeSteps
        ) {

          clearInterval(
            fadeTimer
          );


          oldAudio.pause();

          oldAudio.currentTime =
            0;

          oldAudio.volume =
            1;

        }

      },
      (REPEAT_OVERLAP * 1000) /
        fadeSteps
    );


  musicAudio =
    newAudio;


  // Schedule the next repeat.
  newAudio.addEventListener(
    "loadedmetadata",
    () => {

      scheduleRepeat();

    },
    {
      once: true
    }
  );

}


// --------------------------------------------------
// STOP MUSIC
// --------------------------------------------------

function stopMusic() {

  clearTimeout(
    repeatTimer
  );

  repeatTimer =
    null;


  if (musicAudio) {

    musicAudio.pause();

    musicAudio.currentTime =
      0;

  }

  musicAudio =
    null;

}


// --------------------------------------------------
// JOIN
// --------------------------------------------------

joinButton.onclick =
  async () => {

    const code =
      codeInput.value
        .trim()
        .toUpperCase();


    if (code.length !== 8) {

      message.textContent =
        "Enter the 8-character code.";

      return;

    }


    joinButton.disabled =
      true;

    message.textContent =
      "Connecting...";


    if (channel) {

      await supabase.removeChannel(
        channel
      );

    }


    channel =
      supabase.channel(
        "soundboard-" + code
      );


    // ------------------------------------------------
    // PRELOAD AUDIO
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "preload-audio"
      },
      () => {

        preloadAllAudio();

      }
    );


    // ------------------------------------------------
    // SOUND
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "play-sound"
      },
      message => {

        const payload =
          message.payload;


        if (
          payload &&
          payload.url
        ) {

          status.textContent =
            "🔊 Playing: " +
            payload.file;


          playUrl(
            payload.url,
            payload.file
          );

        }

      }
    );


    // ------------------------------------------------
    // MUSIC
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "play-music"
      },
      message => {

        const payload =
          message.payload;


        if (
          !payload ||
          !payload.url
        ) {

          return;

        }


        if (musicAudio) {

          musicAudio.pause();

        }


        currentMusicFile =
          payload.file;

        currentMusicUrl =
          payload.url;


        stopMusic();


        const audioSource =
          preloadedAudio.has(
            payload.file
          )

            ? preloadedAudio.get(
                payload.file
              )

            : payload.url;


        musicAudio =
          new Audio(
            audioSource
          );


        musicAudio.loop =
          false;


        musicAudio.onended =
          () => {

            console.log(
              "Music ended."
            );


            if (!repeatMusic) {

              status.textContent =
                "🟢 Music finished";

            }

          };


        status.textContent =
          "🎵 Playing: " +
          payload.file;


        if (!audioEnabled) {

          status.textContent =
            "⚠️ Music received. Click Enable Audio.";

          return;

        }


        musicAudio.play()
          .then(() => {

            scheduleRepeat();

          })
          .catch(error => {

            console.error(
              error
            );

            status.textContent =
              "🔴 Music playback failed.";

          });

      }
    );


    // ------------------------------------------------
    // MUSIC PAUSE
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "pause-music"
      },
      () => {

        console.log(
          "MUSIC PAUSE"
        );


        if (musicAudio) {

          musicAudio.pause();

          clearTimeout(
            repeatTimer
          );

          repeatTimer =
            null;


          status.textContent =
            "⏸ Music paused";

        }

      }
    );


    // ------------------------------------------------
    // MUSIC REPEAT
    // ------------------------------------------------

    channel.on(
      "broadcast",
      {
        event: "repeat-music"
      },
      message => {

        console.log(
          "MUSIC REPEAT:",
          message
        );


        const file =
          message?.payload?.file;


        const repeat =
          message?.payload?.repeat;


        // Only respond to the repeat command
        // for the currently playing song.
        if (
          file &&
          currentMusicFile !== file
        ) {

          return;

        }


        repeatMusic =
          !!repeat;


        if (repeatMusic) {

          scheduleRepeat();

        } else {

          clearTimeout(
            repeatTimer
          );

          repeatTimer =
            null;

        }


        status.textContent =
          repeatMusic
            ? "🔁 Music repeating"
            : "🎵 Repeat off";

      }
    );


    // ------------------------------------------------
    // CONNECT
    // ------------------------------------------------

    channel.subscribe(
      state => {

        if (
          state === "SUBSCRIBED"
        ) {

          join.style.display =
            "none";

          player.style.display =
            "block";

          message.textContent =
            "";

          status.textContent =
            audioEnabled

              ? "🟢 Connected — waiting for sounds."

              : "🟢 Connected — click Enable Audio.";

        }


        if (
          state === "CHANNEL_ERROR" ||
          state === "TIMED_OUT"
        ) {

          joinButton.disabled =
            false;

          message.textContent =
            "Could not connect to that session.";

          status.textContent =
            "🔴 Connection failed.";

        }

      }
    );

  };


// --------------------------------------------------
// LEAVE
// --------------------------------------------------

leaveButton.onclick =
  async () => {

    stopMusic();


    currentMusicFile =
      null;


    currentMusicUrl =
      null;


    repeatMusic =
      false;


    // Release preloaded audio URLs.
    for (
      const objectUrl
      of preloadedAudio.values()
    ) {

      URL.revokeObjectURL(
        objectUrl
      );

    }


    preloadedAudio.clear();


    if (channel) {

      await supabase.removeChannel(
        channel
      );

      channel =
        null;

    }


    join.style.display =
      "block";

    player.style.display =
      "none";

    codeInput.value =
      "";

    joinButton.disabled =
      false;

    status.textContent =
      "Enter the host's session code.";

  };


// --------------------------------------------------
// ENTER KEY
// --------------------------------------------------

codeInput.addEventListener(
  "keydown",
  event => {

    if (event.key === "Enter") {

      joinButton.click();

    }

  }
);

</script>

</body>
</html>
