<!DOCTYPE html>
<html>
<head>
  <title>Supabase Test</title>
</head>

<body>

  <h1>Supabase Test</h1>

  <pre id="status">Loading...</pre>

  <script>
    fetch("keys.json")
      .then(response => {
        if (!response.ok) {
          throw new Error("Could not load keys.json: " + response.status);
        }

        return response.json();
      })
      .then(keys => {

        document.getElementById("status").textContent =
          "URL loaded:\n" +
          keys.supabaseUrl +
          "\n\nKey loaded: " +
          (keys.supabaseKey ? "YES" : "NO");

        console.log("Keys loaded:", keys);

      })
      .catch(error => {

        document.getElementById("status").textContent =
          "ERROR:\n" + error.message;

        console.error(error);

      });
  </script>

</body>
</html>
