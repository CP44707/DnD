<!DOCTYPE html>
<html>
<head>
  <title>Player</title>
</head>
<body>
  <div id="display"></div>

  <script>
    const display = document.getElementById("display");

    function update() {
      display.textContent = localStorage.getItem("hostText") || "";
    }

    update();
    setInterval(update, 100);
  </script>
</body>
</html>
